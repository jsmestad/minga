# git_status_encoder.ex encode_git_toast/1: an absent toast is just a presence
# byte (0); a present toast adds level, action, and the message string. The
# Layer 2 builder normalizes a missing toast to %{present: 0} so the wire stays
# non-nullable.
[[structures]]
name = "git_toast"
fields = [{ name = "present", type = "u8" }]
conditional_tail = { guard = "present == 1", fields = [
  { name = "level", type = "enum", enum = "git_toast_level" },
  { name = "action", type = "enum", enum = "git_toast_action" },
  { name = "message", type = "string16" },
] }

# ── Section layouts for sectioned commands ────────────────────────────────
#
# Each [[sections]] entry describes one section within a sectioned opcode.
# The opcode field links it to the parent [[opcodes]] entry by name.
# The generator uses these to emit section-dispatch decode functions.
#
# Generated section decoders take an explicit window end (sectionStart +
# sectionLen) and bound every read against it: a section decoder never reads
# past its own section even when the underlying buffer carries more bytes.
#
# A trailing field may set `optional = true`. Optional fields must form a
# contiguous suffix of an inline section's fixed `fields` (it is rejected on
# command_fields, structures, and counted_array-layout sections, none of which
# carry a section window). Semantics: the decoder reads an optional field only
# if the window has room for it; otherwise the field takes its zero value
# (empty string / 0) and the tail stops. This expresses positionally the
# `if psLen >= N` tolerance the hand-written frontend decoders use, so a peer
# that emits a shorter section (an older or newer frontend) still decodes.

# gui_window_content (0x80) sections

[[sections]]
opcode = "gui_window_content"
id = 0x01
name = "header"
fields = [
  { name = "window_id", type = "u16" },
  { name = "flags", type = "u8" },
  { name = "cursor_row", type = "u16" },
  { name = "cursor_col", type = "u16" },
  { name = "cursor_shape", type = "u8" },
  { name = "scroll_left", type = "u16" },
  { name = "content_epoch", type = "u32" },
]

[[sections]]
opcode = "gui_window_content"
id = 0x02
name = "rows"
layout = "counted_array"
count_type = "u32"
element = "row"

[[sections]]
opcode = "gui_window_content"
id = 0x03
name = "selection"
fields = [{ name = "type", type = "u8" }]
# When type != 0, followed by: start_row:u16, start_col:u16, end_row:u16, end_col:u16
conditional_tail = { guard = "type != 0", fields = [
  { name = "start_row", type = "u16" },
  { name = "start_col", type = "u16" },
  { name = "end_row", type = "u16" },
  { name = "end_col", type = "u16" },
] }

[[sections]]
opcode = "gui_window_content"
id = 0x04
name = "search_matches"
layout = "counted_array"
count_type = "u16"
element = "search_match"

[[sections]]
