# Minga port protocol opcode registry.
# This is the single source of truth for generated opcode constants across Elixir, Swift, and Zig.

version = "2.0.0"
# protocol_version is the integer the BEAM and every frontend compile against and
# exchange in the `ready` handshake. The BEAM rejects a frontend whose value does
# not match and shows an explicit `protocol_error` instead of silently desyncing.
# Bump this whenever the wire contract changes incompatibly. The 2.0.0 bump
# retired the 9 cell-paradigm render opcodes; see docs/PROTOCOL.md.
# protocol_version 3 (#2219 children A/B) adds the frame-transaction vocabulary
# (begin_frame, commit_frame, request_keyframe) and authoritative layout
# (surface_placement, gui_surface_layout). batch_end (0x13) was retired: child B
# moved its input-correlation u32 onto commit_frame and made the begin/commit pair
# bracket every frame. See docs/PROTOCOL.md.
# protocol_version 4 adds the gui_file_tree row heat_level byte for extension-owned
# familiarity tinting. This changes the hand-decoded file-tree row payload.
# protocol_version 5 adds producer-assigned stream_instance to the Messages stream.
# protocol_version 6 frames gui_agent_context and appends gui_edit_timeline file summaries.
# protocol_version 7 baseline.
# protocol_version 8 adds set_link_cursor (#2630): a 1-byte beam_to_frontend hint
# that toggles the pointing-hand cursor while Cmd/Ctrl+hover previews a navigable
# go-to-definition symbol. Emitted out-of-band (post-commit), like set_title.
# protocol_version 9 promotes gui_window_content (0x80) from u16 sectioned framing
# to len32 command framing with u32 inner section lengths.
# protocol_version 10 widens clipboard_write and the A1/A2 window delta section
# carriers and row counts to u32 so large payloads cannot silently wrap.
# protocol_version 11 makes frame transactions generation-aware, adds explicit
# applied/rejected/window-reference-miss acknowledgements (#2739), and evolves
# A2 row updates from legacy complete section 0x02 snapshots to immutable-base
# RowSplices section 0x0B (#2741).
# protocol_version 12 appends a disposition byte to frame_rejected and appends
# the versioned hard-dimension resource policy to frontend capabilities (#2801).
protocol_version = 12
description = "Minga port protocol opcode registry"

# Directions:
# - frontend_to_beam: emitted by a frontend or parser process and decoded by the BEAM
# - beam_to_frontend: emitted by the BEAM and decoded by a frontend process
# - beam_to_parser: emitted by the BEAM and decoded by the parser process
# - parser_to_beam: emitted by the parser process and decoded by the BEAM

