# surface_placement (#2219 child A) is the authoritative position/precedence of one
# surface for the current frame, carried by gui_surface_layout. surface_id keys the
# surface; rect is its terminal-cell bounds; z is the stacking order (higher draws
# later/on top, replacing overlayLines() precedence); hit_kind classifies it for
