# ── Shared wire structures ────────────────────────────────────────────────
#
# Reusable fixed-size and variable-length sub-structures referenced by name
# in opcode section definitions. The generator computes byte sizes for
# fixed-size structures and emits struct definitions + decode functions in
# each target language.
#
# Type primitives:
#   u8, u16, u24, u32, u64        — unsigned integers (big-endian)
#   string8, string16, string32    — length-prefixed UTF-8 (u8/u16/u32 len + bytes)
#   rgb                            — 3-byte color (r:u8, g:u8, b:u8)
#   counted_array                  — count prefix + repeated elements
#   struct                         — reference to another [[structures]] entry

[[structures]]
name = "rect"
fields = [
  { name = "row", type = "u16" },
  { name = "col", type = "u16" },
  { name = "width", type = "u16" },
  { name = "height", type = "u16" },
]

[[structures]]
name = "span"
fields = [
  { name = "start_col", type = "u16" },
  { name = "end_col", type = "u16" },
  { name = "fg", type = "rgb" },
  { name = "bg", type = "rgb" },
  { name = "attrs", type = "u8" },
  { name = "font_weight", type = "u8" },
  { name = "font_id", type = "u8" },
]

[[structures]]
name = "row"
fields = [
  { name = "row_type", type = "u8" },
  { name = "row_id", type = "u64" },
  { name = "buf_line", type = "u32" },
  { name = "content_hash", type = "u32" },
  { name = "text", type = "string32" },
  { name = "spans", type = "counted_array", count_type = "u16", element = "span" },
]

[[structures]]
name = "search_match"
fields = [
  { name = "row", type = "u16" },
  { name = "start_col", type = "u16" },
  { name = "end_col", type = "u16" },
  { name = "is_current", type = "u8" },
]

[[structures]]
name = "diagnostic_range"
fields = [
  { name = "start_row", type = "u16" },
  { name = "start_col", type = "u16" },
  { name = "end_row", type = "u16" },
  { name = "end_col", type = "u16" },
  { name = "severity", type = "u8" },
]

[[structures]]
name = "document_highlight"
fields = [
  { name = "start_row", type = "u16" },
  { name = "start_col", type = "u16" },
  { name = "end_row", type = "u16" },
  { name = "end_col", type = "u16" },
  { name = "kind", type = "u8" },
]

[[structures]]
name = "annotation"
fields = [
  { name = "row", type = "u16" },
