# gui_picker (0x77) sections

[[sections]]
opcode = "gui_picker"
id = 0x01
name = "header"
# picker_encoder.ex encode_picker/1: a constant marker byte (1), then the
# counts, has_preview flag, title, and marked_count. The encoder writes
# total_count as u16, not u32, and emits the title + marked_count tail.
#
# `title` and `marked_count` are the trailing tail the hand-written frontend
# decoders read only `if psLen >= 10`. Marking them `optional = true` declares
# that positional tolerance: a section decoder reads them only if its window has
# room, otherwise they take their zero value (empty string / 0) and the tail
# stops. This keeps the generated decoder as forward-compatible as the
# hand-written one. The Elixir encoder always emits the full tail, so full-tail
# goldens are unaffected; new short-section fixtures prove the tolerance.
fields = [
  { name = "visible", type = "u8" },
  { name = "selected_index", type = "u16" },
  { name = "filtered_count", type = "u16" },
  { name = "total_count", type = "u16" },
  { name = "has_preview", type = "u8" },
  { name = "title", type = "string16", optional = true },
  { name = "marked_count", type = "u16", optional = true },
]

[[sections]]
opcode = "gui_picker"
id = 0x02
name = "query"
fields = [
  { name = "text", type = "string16" },
  { name = "generation", type = "u32", optional = true },
  { name = "acknowledged_edit_seq", type = "u32", optional = true },
]

[[sections]]
opcode = "gui_picker"
id = 0x03
name = "items"
layout = "counted_array"
count_type = "u16"
element = "picker_item"

[[sections]]
opcode = "gui_picker"
id = 0x04
name = "action_menu"
# picker_encoder.ex encode_action_menu/1: hidden menus encode just the visible
# byte (0); a visible menu adds selected_index plus a u8-counted list of action
# name strings.
fields = [{ name = "visible", type = "u8" }]
conditional_tail = { guard = "visible == 1", fields = [
  { name = "selected_index", type = "u8" },
  { name = "actions", type = "counted_array", count_type = "u8", element = "string16" },
] }

[[sections]]
opcode = "gui_picker"
id = 0x05
name = "mode_prefix"
fields = [{ name = "text", type = "string16" }]

[[sections]]
opcode = "gui_picker"
id = 0x06
name = "load_status"
# picker_encoder.ex encode_load_status/1: :ready/:loading encode just the status
# byte (0/1); {:error, reason} adds status 2 plus the message string.
fields = [{ name = "status", type = "u8" }]
conditional_tail = { guard = "status == 2", fields = [
  { name = "message", type = "string16" },
] }

