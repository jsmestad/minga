# request_keyframe (#2219 child A) asks the BEAM to send the next frame as a full
# keyframe (a transaction with base_frame_seq == 0). A frontend emits it after any
# invalidation (truncation, seq mismatch, in-transaction sizing failure, base
# mismatch) carrying last_good_frame_seq:u32 — the last frame_seq it committed
# cleanly (0 if it has none), plus the generation that failed. fixed:9 =
# opcode(1) + last_good_frame_seq(u32) + generation(u32). The BEAM always starts a
# fresh generation before publishing the recovery keyframe.
[[opcodes]]
category = "input"
name = "request_keyframe"
value = 0x08
direction = "frontend_to_beam"
framing = "fixed:9"

[[opcodes]]
category = "input"
name = "scroll_batch"
value = 0x09
direction = "frontend_to_beam"
framing = "fixed:6"

# Frame status events (#2739, #2801). Rejection reasons and dispositions are
# generated from the enum vocabularies below. frame_rejected appends disposition
# after the original correlated fields, preserving generation, frame sequence,
# last-good base, and reason positions. Resource-policy rejection is terminal by
# default; an adapted retry requires a producer-local named-dimension descriptor.
[[opcodes]]
category = "input"
name = "frame_applied"
value = 0x0A
direction = "frontend_to_beam"
framing = "fixed:9"

[[opcodes]]
category = "input"
name = "frame_rejected"
value = 0x0B
direction = "frontend_to_beam"
framing = "fixed:15"

[[opcodes]]
category = "input"
name = "window_ref_miss"
value = 0x0C
direction = "frontend_to_beam"
framing = "fixed:15"

[[opcodes]]
category = "input"
name = "log_message"
value = 0x60
direction = "frontend_to_beam"

# Render-transport commands. The 9 cell-paradigm opcodes (draw_text 0x10,
# set_cursor 0x11, clear 0x12, define_region 0x14, clear_region 0x18,
# destroy_region 0x19, set_active_region 0x1A, scroll_region 0x1B,
# draw_styled_text 0x1C) were retired in protocol_version 2; semantic windows
# (gui_window_content 0x80) replaced them. Only transport-level framing survives
# here: set_cursor_shape, set_title, set_window_bg, protocol_error, and the
# protocol_version-3 frame-transaction markers begin_frame/commit_frame (which
# replaced batch_end as the per-frame boundary in child B).
# See docs/PROTOCOL.md.

# Reuse policy for freed cell-paradigm values: a retired value may be reassigned
# once protocol_version has bumped past the version that retired it, the same way
# protocol_error (0x18) reuses the freed clear_region slot under version 2. Under
# protocol_version 3, begin_frame and commit_frame reuse the freed draw_text
# (0x10) and set_cursor (0x11) slots.

# begin_frame (#2219 child A) opens a frame transaction. fixed:9 = opcode(1) +
# frame_seq(u32) + base_frame_seq(u32) + generation(u32). frame_seq is the strictly monotonic global
# frame sequence (reuses Renderer.Server's seq) used for resync/attach ordering.
# base_frame_seq names the frame this transaction's deltas assume; base_frame_seq
# == 0 means keyframe (full snapshots, no deltas — also the multi-client attach
# mechanism). The BEAM emits begin_frame at the head of every frame (#2219 child B);
# both frontends decode it but ignore base_frame_seq for now (staging is child C/D).
[[opcodes]]
category = "render"
name = "begin_frame"
value = 0x10
direction = "beam_to_frontend"
framing = "fixed:13"

# commit_frame (#2219 child A) closes a frame transaction; a frontend promotes its
# staged commands and presents the frame on this opcode. fixed:9 = opcode(1) +
# frame_seq(u32) + input_seq(u32). frame_seq must match the open begin_frame's
# frame_seq (a mismatch is an invalidation). input_seq is batch_end's echoed input
# correlation sequence, moved here verbatim: a frontend resolves a keystroke-to-
# write latency sample when the frame presents. input_seq 0 means "no correlation";
# it is a SEPARATE id from frame_seq (idle re-renders advance frame_seq while
# echoing a stale input_seq). The BEAM emits commit_frame to close every frame
# (#2219 child B); both frontends gate the frame and resolve latency on it.
[[opcodes]]
category = "render"
name = "commit_frame"
value = 0x11
direction = "beam_to_frontend"
framing = "fixed:9"

# batch_end (value 0x13) was retired in protocol_version 3 (#2219 child B). Its
# input-correlation u32 moved verbatim onto commit_frame, which now closes every
# frame transaction; both frontends gate frames and resolve keystroke latency on
# commit_frame. The 0x13 slot is reserved (do not reassign before a version bump
# past 3, per the freed-value reuse policy above).

[[opcodes]]
category = "render"
name = "set_cursor_shape"
value = 0x15
direction = "beam_to_frontend"
framing = "fixed:2"

[[opcodes]]
category = "render"
name = "set_title"
value = 0x16
direction = "beam_to_frontend"
framing = "len16"

[[opcodes]]
category = "render"
name = "set_window_bg"
value = 0x17
direction = "beam_to_frontend"
framing = "fixed:4"

# set_link_cursor (#2630) reuses the freed cell-paradigm value 0x19 (destroy_region,
# retired in protocol_version 2). fixed:2 = opcode(1) + active(u8: 1 = navigable
# symbol under the pointer, 0 = none). The GUI frontend toggles NSCursor.pointingHand
# on this hint while Cmd+hover previews a go-to-definition link; the TUI sizes and
# skips it (no terminal pointer-shape control). Emitted out-of-band post-commit, so
# it joins the frontend out-of-band allowlist alongside set_title/set_window_bg.
[[opcodes]]
category = "render"
name = "set_link_cursor"
value = 0x19
direction = "beam_to_frontend"
framing = "fixed:2"

# protocol_error reuses the freed cell-paradigm value 0x18. The BEAM emits it when
# a frontend's handshake protocol_version does not match the BEAM's, carrying a
# UTF-8 reason the frontend displays as a blocking error instead of decoding a
# stream it cannot parse. len16-framed: opcode(1) + len(u16) + UTF-8 message.
[[opcodes]]
category = "render"
name = "protocol_error"
value = 0x18
direction = "beam_to_frontend"
framing = "len16"

