# gui_surface_layout (#2219 child A) carries authoritative per-frame surface
# placement inside a frame transaction. It is the single source of placement and
# precedence: surface rects/z come from data, not from frontend overlay heuristics
# (Go deletes overlayLines() and sorts by z; mouse zones derive from these rects).
# It carries one counted array of surface_placement (see the section below).
# Coordinates are TERMINAL CELLS for both frontends; the GUI treats rect/z as
# structural hints and keeps native intra-widget pixel layout (never send pixels).
# Sectioned framing reuses the gui_window_content counted-array carrier so the
# generator emits a placement decoder both frontends already know how to size.
# Decoders exist now; the BEAM does not emit it until #2219 child E (#2268).
# Child E note: the golden fixtures in test/support/protocol_golden.ex currently
# build placements via the generated Minga.Protocol.Encode encoder; if E adds a
# hand-written production encoder, switch the fixtures to it so hand-encoder
# drift is also caught.
[[opcodes]]
category = "gui_semantic"
name = "gui_surface_layout"
value = 0xA4
direction = "beam_to_frontend"
framing = "sectioned"

# gui_empty_state (#2689) carries the zero-buffers launchpad: data-driven
