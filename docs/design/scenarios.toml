# Minga scenario inventory
#
# Every screen and state Minga can show, on macOS and in the TUI. The design
# storyboard, the design-time flow map and (later) the storyboard factory's
# fixtures are all built from this file. See storyboard.md.
#
# Schema, one [[scenario]] per screen and state:
#
#   id         stable dotted id, "<journey>.<screen>[.<state>]". Never reuse an id.
#   journey    one of the journeys listed below.
#   title      what the user sees, in words.
#   surfaces   the surfaces on screen (see surfaces.md), e.g. ["modeline", "drawer:tasks"].
#   states     the Minga or UI states shown, e.g. ["needs_you", "working"].
#   frontends  ["macos", "tui"], or one of them with platform_only_reason set.
#   status     "designed" | "existing-only" | "missing".
#              designed:      a design board exists and follows docs/design.
#              existing-only: the screen exists in the app but has not been redesigned.
#              missing:       no design and no implementation.
#   boards     design canvas board files when designed: { macos = "...", tui = "..." }.
#   exits      every way out, by key and by click:
#              [{ key = "SPC a a", click = "modeline needs-you segment", to = "tasks.drawer.needs_you" }]
#              Use click = "" for keyboard-only exits and say why in a note.
#              A "to" id that has no [[scenario]] yet is an inventory gap.
#   notes      anything a reviewer needs; open questions.
#
# Journeys:
#   start       launch, first run, open a project, quit
#   edit        editing and navigation in a file
#   search      search in buffer, project search, replace
#   code        completion, hover, signature help, diagnostics, code actions, rename, references
#   git         status, blame, hunks, conflicts, commit
#   minga       tasks, conversation, composer, queue, review, subagents, approvals
#   terminal    the built-in terminal and *minga-shell*
#   files       switcher, file tree, buffers, pinned files
#   windows     splits, drawers, focus, narrow windows
#   settings    config, themes, keybindings, extensions, help
#   errors      error notices, empty states, crashes, reconnects
#
# Status at the start of the storyboard: the scenarios below are the designed
# ones from the V4.1 design round. existing-only and missing scenarios are added
# during the storyboard inventory.

[[scenario]]
id = "edit.working"
journey = "edit"
title = "Editing while Minga works in the same file"
surfaces = ["title_bar", "editor", "gutter", "modeline"]
states = ["working", "needs_you"]
frontends = ["macos", "tui"]
status = "designed"
boards = { macos = "V41Edit.dc.html", tui = "V41TuiEdit.dc.html" }
exits = [
  { key = "SPC (pause)", click = "", to = "edit.whichkey.leader" },
  { key = "SPC a (pause)", click = "", to = "minga.whichkey" },
  { key = "SPC a a", click = "modeline needs-you segment", to = "minga.tasks.needs_you" },
  { key = "SPC a v", click = "modeline Minga segment", to = "minga.conversation" },
  { key = "SPC a r", click = "", to = "minga.review.buffer" },
  { key = "]h", click = "twist head", to = "minga.review.in_file" },
  { key = "SPC ,", click = "title bar file name", to = "files.switcher" },
  { key = "K", click = "hover the underline", to = "code.diagnostics.hover" },
  { key = "SPC c d", click = "modeline diagnostics segment", to = "code.diagnostics.list" },
  { key = "SPC o t", click = "", to = "terminal.drawer" },
]
notes = "Which-key has no click path by design (it is the keyboard's discovery surface); its targets are all reachable by click elsewhere. SPC a r and SPC o t need a click path: the menu bar Minga and View menus on macOS, TBD in the TUI."

[[scenario]]
id = "minga.whichkey"
journey = "minga"
title = "SPC a and a pause: which-key for Minga"
surfaces = ["editor", "whichkey", "modeline"]
states = ["working", "needs_you"]
frontends = ["macos", "tui"]
status = "designed"
boards = { macos = "V41WhichKey.dc.html", tui = "V41TuiEdit.dc.html" }
exits = [
  { key = "a", click = "Tasks row", to = "minga.tasks.needs_you" },
  { key = "v", click = "Conversation row", to = "minga.conversation" },
  { key = "r", click = "Review row", to = "minga.review.buffer" },
  { key = "i", click = "Inspect row", to = "minga.subagent.peek" },
  { key = "w", click = "Watch row", to = "terminal.minga_shell" },
  { key = "J", click = "Queued inputs row", to = "minga.queue" },
  { key = "u", click = "Reject all row", to = "minga.reject_all.confirm" },
  { key = "esc", click = "click outside", to = "edit.working" },
  { key = "backspace", click = "breadcrumb SPC", to = "edit.whichkey.leader" },
]

[[scenario]]
id = "minga.tasks.needs_you"
journey = "minga"
title = "Tasks drawer with one task that needs you"
surfaces = ["editor", "drawer:tasks", "modeline"]
states = ["needs_you", "working", "waiting", "failed", "done"]
frontends = ["macos", "tui"]
status = "designed"
boards = { macos = "V41Tasks.dc.html", tui = "V41TuiTasks.dc.html" }
exits = [
  { key = "y", click = "Approve once", to = "minga.tasks.working" },
  { key = "a", click = "Always for this session", to = "minga.tasks.working" },
  { key = "t", click = "This turn", to = "minga.tasks.working" },
  { key = "n", click = "Deny", to = "minga.tasks.working" },
  { key = "=", click = "Show diff", to = "minga.approval.diff" },
  { key = "↩", click = "row title", to = "minga.conversation" },
  { key = "i", click = "Inspect", to = "minga.subagent.peek" },
  { key = "r", click = "Retry now", to = "minga.tasks.working" },
  { key = "o", click = "Output", to = "minga.task.output" },
  { key = "↩ on a done row", click = "Review", to = "minga.review.buffer" },
  { key = "q", click = "drawer close", to = "edit.working" },
  { key = "esc", click = "", to = "edit.working" },
]
notes = "Empty state (no tasks) is not designed: see minga.tasks.empty."

[[scenario]]
id = "minga.review.buffer"
journey = "minga"
title = "*minga-review* beside the file, change 1 of 2"
surfaces = ["drawer:review", "editor", "gutter", "modeline"]
states = ["done"]
frontends = ["macos", "tui"]
status = "designed"
boards = { macos = "V41Review.dc.html", tui = "V41TuiReview.dc.html" }
exits = [
  { key = "y", click = "Keep", to = "minga.review.buffer" },
  { key = "n", click = "Reject", to = "minga.review.buffer" },
  { key = "=", click = "Diff", to = "minga.review.buffer" },
  { key = "Y", click = "Keep all", to = "minga.review.keep_all.confirm" },
  { key = "↩", click = "change row", to = "minga.review.in_file" },
  { key = "q", click = "close", to = "edit.working" },
]
notes = "After the last change is decided, the buffer needs a defined end state: see minga.review.all_decided."

[[scenario]]
id = "minga.review.in_file"
journey = "minga"
title = "Cursor inside one of Minga's changes in a file"
surfaces = ["editor", "gutter", "modeline"]
states = ["unreviewed"]
frontends = ["macos", "tui"]
status = "designed"
boards = { macos = "V41Review.dc.html", tui = "V41TuiReview.dc.html" }
exits = [
  { key = "SPC g k", click = "twist head › Keep", to = "edit.working" },
  { key = "SPC g r", click = "twist head › Reject", to = "edit.working" },
  { key = "]h", click = "", to = "minga.review.in_file" },
  { key = "any motion out of the change", click = "click elsewhere", to = "edit.working" },
]
notes = "]h has no click path; the twist head of the next change is the click equivalent. ]e already means next agent edit today: see ADR-0006."

