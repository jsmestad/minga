boards = { macos = "V41Edit.dc.html", tui = "V41TuiEdit.dc.html" }
home = true
exits = [
  { key = "SPC (pause)", click = "", to = "edit.whichkey.leader" },
  { key = "SPC a (pause)", click = "mode pill › Minga (macOS: also the Minga menu)", to = "minga.whichkey" },
  { key = "SPC a a", click = "modeline needs-you segment", to = "minga.tasks.needs_you" },
  { key = "SPC a v", click = "modeline Minga segment", to = "minga.conversation" },
  { key = "SPC a r", click = "mode pill › Minga › Review (macOS: also the menu bar)", to = "minga.review.buffer" },
  { key = "]h", click = "twist head", to = "minga.review.in_file" },
  { key = "K", click = "rest the pointer on a Minga line", to = "minga.hover.attribution" },
  { key = "SPC ,", click = "title bar file name", to = "files.switcher" },
  { key = "K", click = "hover the underline", to = "code.diagnostics.hover" },
