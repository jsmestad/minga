# Minga scenario inventory
#
# Every screen and state Minga can show, on macOS and in the TUI. The design
# storyboard, the design-time flow map and (later) the storyboard factory's
# fixtures are all built from this file. See storyboard.md.
#
# Schema, one [[scenario]] per screen and state:
#
#   id         stable dotted id, "<journey>.<screen>[.<state>]". Never reuse an id.
#   journey    one of the journeys listed below.
#   title      what the user sees, in words.
#   surfaces   the surfaces on screen (see surfaces.md), e.g. ["modeline", "drawer:tasks"].
#   states     the Minga or UI states shown, e.g. ["needs_you", "working"].
#   frontends  ["macos", "tui"], or one of them with platform_only_reason set.
#   status     "designed" | "existing-only" | "missing" | "removed".
#              designed:      a design board exists and follows docs/design.
#              existing-only: the screen exists in the app but has not been redesigned.
#              missing:       no design and no implementation.
#              removed:       exists today; the Spine takes it away (notes say where its job goes).
#   boards     design canvas board files when designed: { macos = "...", tui = "..." }.
#   exits      every way out, by key and by click:
#              [{ key = "SPC a a", click = "modeline needs-you segment", to = "minga.tasks.needs_you" }]
#              Use click = "" for keyboard-only exits and say why in a note.
#              A "to" id that has no [[scenario]] yet is an inventory gap.
#   notes      anything a reviewer needs; open questions.
#
# Top-level key:
#
#   phase           "keyboard" while mouse paths are pending the mouse sweep (missing click
#                   paths are reported but do not fail the checker), "final" after it.
#
# Flags used by the flow-map checker (design/tools/storyboard/check.py):
#
#   cold_start      true on the one scenario a fresh launch lands on.
#   home            true on resting views (plain editing and its variants). Every
#                   other scenario must reach a home scenario within 3 presses of
#                   esc or q, or of an exit marked back = true (no dead ends).
#   reached_by      for scenarios that happen to you rather than places you go to
#                   (errors, notifications, Minga asking): the event that shows it.
#                   The checker treats these as reachable.
#   outside_app     true for system surfaces such as a desktop notification.
#   transient       true for surfaces that exist to be acted on and closed
#                   (drawers, pickers, menus, prompts, which-key). Every exit on a
#                   transient surface needs both a key and a click, unless the exit
#                   sets keyboard_only = "<reason>".
#   list            true when the surface lists things. It must name its
#                   empty_state, a scenario id for the zero case.
#   terminal_state  true when the scenario ends the session (quit).
#   exit fields     key, click, to, plus optional keyboard_only (reason), back
#                   (true for an escape that is not esc or q, such as ⌃\ ⌃N in a
#                   terminal or ⌘W on a window) and note.
#
# Journeys:
#   start       launch, first run, open a project, quit
#   edit        editing and navigation in a file
#   search      search in buffer, project search, replace
#   code        completion, hover, signature help, diagnostics, code actions, rename, references
#   git         status, blame, hunks, conflicts, commit
#   minga       tasks, conversation, composer, queue, review, subagents, approvals
#   terminal    the built-in terminal and *minga-shell*
#   files       switcher, file tree, buffers, pinned files
#   windows     splits, drawers, focus, narrow windows
#   settings    config, themes, keybindings, extensions, help
#   errors      error notices, empty states, crashes, reconnects
#
# The inventory covers every screen and state found in the semantic UI builders,
# the macOS views, the Go TUI and the leader keymap, plus the empty states and
# lifecycle screens the Spine needs. Within a journey, removed scenarios come last.

# ---- start -----------------------------------------------------------------

# Design phase. "keyboard": click paths are pending the mouse sweep and do not fail
# the checker. Set to "final" once every scenario has had its mouse sweep.
phase = "keyboard"

[[scenario]]
id = "start.empty"
journey = "start"
title = "Launched with no file open"
surfaces = ["empty_state", "modeline"]
states = []
frontends = ["macos", "tui"]
status = "existing-only"
cold_start = true
home = true
exits = [
  { key = "SPC SPC", click = "Find file", to = "files.project_find" },
  { key = "SPC p p", click = "Open project", to = "start.project_switcher" },
  { key = "SPC p r", click = "Recent file", to = "start.recent_files" },
  { key = "SPC ,", click = "", to = "files.switcher" },
  { key = "SPC h T", click = "Tutorial", to = "settings.tutorial" },
  { key = "SPC q q", click = "", to = "start.quit.confirm" },
]
notes = "The cold-start scenario for reachability. Existing empty_state builder; the Spine version needs a board (resting view, wordmark, a few actions as text with keys)."

[[scenario]]
id = "start.first_run"
journey = "start"
title = "First run: Servus, choose keymap and provider"
surfaces = ["welcome"]
states = []
frontends = ["macos", "tui"]
status = "missing"
reached_by = "the first launch"
transient = true
exits = [
  { key = "↩", click = "Continue", to = "start.empty" },
  { key = "esc", click = "Skip", to = "start.empty" },
]
notes = "Bavarian voice belongs here (Servus). Picks Vim or CUA keys, theme follows the system, signs in a model provider or skips."

[[scenario]]
id = "start.project_switcher"
journey = "start"
title = "SPC p p: switch project"
surfaces = ["picker"]
states = []
frontends = ["macos", "tui"]
status = "existing-only"
transient = true
list = true
empty_state = "start.project_switcher.empty"
exits = [
  { key = "↩", click = "row", to = "edit.plain" },
  { key = "esc", click = "click outside", to = "edit.plain" },
  { key = "SPC p a", click = "", to = "start.project_switcher", note = "add known project" },
]

[[scenario]]
id = "start.project_switcher.empty"
journey = "start"
title = "Project switcher with no known projects"
surfaces = ["picker"]
states = []
frontends = ["macos", "tui"]
status = "missing"
transient = true
exits = [
  { key = "SPC p a", click = "Add project", to = "start.project_switcher" },
  { key = "esc", click = "click outside", to = "edit.plain" },
]

[[scenario]]
id = "start.recent_files"
journey = "start"
title = "SPC p r: recent files in project"
surfaces = ["picker"]
states = []
frontends = ["macos", "tui"]
status = "existing-only"
transient = true
list = true
empty_state = "files.switcher.no_match"
exits = [
  { key = "↩", click = "row", to = "edit.plain" },
  { key = "esc", click = "click outside", to = "edit.plain" },
]

[[scenario]]
id = "start.quit.confirm"
journey = "start"
title = "Quit with unsaved files or Minga working: confirm"
surfaces = ["minibuffer"]
states = []
frontends = ["macos", "tui"]
status = "missing"
transient = true
exits = [
  { key = "y", click = "Quit", to = "start.quit.farewell" },
  { key = "n", click = "Cancel", to = "edit.plain" },
  { key = "esc", click = "click outside", to = "edit.plain" },
]
notes = "Lists what would be lost: unsaved buffers, running tasks, unreviewed changes."

[[scenario]]
id = "start.quit.farewell"
journey = "start"
title = "Pfiat di: the app closes"
surfaces = ["minibuffer"]
states = []
frontends = ["macos", "tui"]
status = "missing"
terminal_state = true
exits = []
notes = "Bavarian voice. Terminal state: the process exits."

# ---- edit ------------------------------------------------------------------

[[scenario]]
id = "edit.working"
journey = "edit"
title = "Editing while Minga works in the same file"
surfaces = ["title_bar", "editor", "gutter", "modeline"]
states = ["working", "needs_you"]
frontends = ["macos", "tui"]
status = "designed"
boards = { macos = "V41Edit.dc.html", tui = "V41TuiEdit.dc.html" }
home = true
exits = [
  { key = "SPC (pause)", click = "", to = "edit.whichkey.leader" },
  { key = "SPC a (pause)", click = "", to = "minga.whichkey" },
  { key = "SPC a a", click = "modeline needs-you segment", to = "minga.tasks.needs_you" },
  { key = "SPC a v", click = "modeline Minga segment", to = "minga.conversation" },
  { key = "SPC a r", click = "", to = "minga.review.buffer" },
  { key = "]h", click = "twist head", to = "minga.review.in_file" },
  { key = "SPC ,", click = "title bar file name", to = "files.switcher" },
  { key = "K", click = "hover the underline", to = "code.diagnostics.hover" },
  { key = "SPC c d", click = "modeline diagnostics segment", to = "code.diagnostics.list" },
  { key = "SPC o t", click = "", to = "terminal.drawer" },
]
notes = "Same resting view as edit.plain with Minga's twist, cursor tag and modeline segments. Which-key has no click path by design (it is the keyboard's discovery surface); its targets are all reachable by click elsewhere. SPC a r and SPC o t need a click path: the menu bar Minga and View menus on macOS, TBD in the TUI."

