]
notes = "Same resting view as edit.plain with Minga's twist, cursor tag and modeline segments. Which-key is clickable on both frontends: the mode pill opens it, every row presses its key and the breadcrumb goes back up, so every leader action is a few clicks away (the macOS menu bar mirrors the same groups)."

