reached_by = "minga . in a directory with no project markers"
exits = [
  { key = "SPC o p", click = "File tree", to = "files.tree" },
  { key = "SPC SPC", click = "Find file", to = "files.project_find" },
  { key = "SPC p a", click = "Add as project", to = "start.project_switcher" },
  { key = "SPC a n", click = "New task", to = "minga.task.new" },
]
notes = "Opens with the directory itself as the root; the home buffer carries a one-line note and the file tree action."

[[scenario]]
id = "start.first_run"
journey = "start"
title = "First run: onboarding (deferred)"
surfaces = ["welcome"]
states = []
frontends = ["macos", "tui"]
status = "deferred"
boards = { macos = "Batch2_start_first_run.dc.html", tui = "Batch2_start_first_run.dc.html" }
reached_by = "the first launch"
transient = true
exits = [
  { key = "↩", click = "Continue", to = "start.empty" },
  { key = "esc", click = "Skip", to = "start.empty" },
]
notes = "Deferred: onboarding needs a rethink (a walkthrough or an interactive tutorial that teaches SPC and Minga by doing; SPC h T exists to build on). Batch2_start_first_run is a placeholder, not the design. Voice: Servus."

[[scenario]]
id = "start.project_switcher"
journey = "start"
title = "SPC p p: switch project"
surfaces = ["picker"]
states = []
frontends = ["macos", "tui"]
status = "existing-only"
transient = true
list = true
empty_state = "start.project_switcher.empty"
exits = [
  { key = "↩", click = "row", to = "edit.plain" },
  { key = "esc", click = "click outside", to = "edit.plain" },
  { key = "SPC p a", click = "Add project button", to = "start.project_switcher", note = "add known project" },
]

[[scenario]]
id = "start.project_switcher.empty"
journey = "start"
title = "Project switcher with no known projects"
surfaces = ["picker"]
states = []
frontends = ["macos", "tui"]
status = "designed"
boards = { macos = "Batch4_files_empty.dc.html", tui = "Batch4_files_empty.dc.html" }
transient = true
exits = [
  { key = "SPC p a", click = "mode pill › Project › Switch project (macOS: also the menu bar)", to = "start.project_switcher" },
  { key = "esc", click = "click outside", to = "start.open_dir.home" },
]

[[scenario]]
id = "start.recent_files"
journey = "start"
title = "SPC p r: recent files in project"
surfaces = ["picker"]
states = []
frontends = ["macos", "tui"]
status = "existing-only"
transient = true
list = true
empty_state = "files.switcher.no_match"
exits = [
  { key = "↩", click = "row", to = "edit.plain" },
  { key = "esc", click = "click outside", to = "edit.plain" },
]

[[scenario]]
id = "start.quit.confirm"
journey = "start"
title = "Quit with unsaved files or Minga working: confirm"
surfaces = ["minibuffer"]
states = []
frontends = ["macos", "tui"]
status = "designed"
boards = { macos = "Batch2_start_quit_confirm.dc.html", tui = "Batch2_start_quit_confirm.dc.html", mouse = "Mouse_Video_ActMenu_Chips.dc.html" }
transient = true
exits = [
  { key = "s", click = "Save all and quit", to = "start.quit.farewell" },
  { key = "d", click = "Discard and quit", to = "start.quit.farewell" },
  { key = "esc", click = "click outside", to = "edit.plain" },
]
notes = "Shown by SPC q q or ⌘Q only when something is at stake. Lists it: unsaved buffers, running tasks, unreviewed changes. s saves all first; d drops only your unsaved edits. Quitting never discards Minga's unreviewed changes: they wait for review next time. Explicit s and d, no y/n ambiguity."

[[scenario]]
id = "start.quit.farewell"
journey = "start"
title = "Ciao: the app closes"
surfaces = ["minibuffer"]
states = []
frontends = ["macos", "tui"]
status = "designed"
boards = { macos = "Batch2_start_quit_farewell.dc.html", tui = "Batch2_start_quit_farewell.dc.html" }
terminal_state = true
exits = []
notes = "Voice: \"Ciao.\" (everyday Munich speech), with an optional one-line summary. macOS: the modeline shows it while the window fades. TUI: printed after the terminal is restored, so it stays in scrollback. Terminal state: the process exits."

