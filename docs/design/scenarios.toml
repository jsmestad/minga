# Minga scenario inventory
#
# Every screen and state Minga can show, on macOS and in the TUI. The design
# storyboard, the design-time flow map and (later) the storyboard factory's
# fixtures are all built from this file. See storyboard.md.
#
# Schema, one [[scenario]] per screen and state:
#
#   id         stable dotted id, "<journey>.<screen>[.<state>]". Never reuse an id.
#   journey    one of the journeys listed below.
#   title      what the user sees, in words.
#   surfaces   the surfaces on screen (see surfaces.md), e.g. ["modeline", "drawer:tasks"].
#   states     the Minga or UI states shown, e.g. ["needs_you", "working"].
#   frontends  ["macos", "tui"], or one of them with platform_only_reason set.
#   status     "designed" | "existing-only" | "missing" | "deferred" | "removed".
#              designed:      a design board exists and follows docs/design.
#              existing-only: the screen exists in the app but has not been redesigned.
#              missing:       no design and no implementation.
#              deferred:      needs a rethink before it is designed; the board, if any, is a placeholder.
#              removed:       exists today; the Spine takes it away (notes say where its job goes).
#   boards     board files in design/boards/ when designed (check.py fails on a missing file): { macos = "...", tui = "..." }, plus
#              optional mouse / mouse_tui boards that show the screen's mouse path playing, and an
#              optional reference board for the surface's chosen visual design.
#   exits      every way out, by key and by click:
#              [{ key = "SPC a a", click = "modeline needs-you segment", to = "minga.tasks.needs_you" }]
#              Use click = "" for keyboard-only exits and say why in a note.
#              A "to" id that has no [[scenario]] yet is an inventory gap.
#   notes      anything a reviewer needs; open questions.
#
# Top-level key:
#
#   phase           "keyboard" while mouse paths are pending the mouse sweep (missing click
#                   paths are reported but do not fail the checker), "final" after it.
#
# Flags used by the flow-map checker (design/tools/storyboard/check.py):
#
#   cold_start      true on the one scenario a fresh launch lands on.
#   home            true on resting views (plain editing and its variants). Every
#                   other scenario must reach a home scenario within 3 presses of
#                   esc or q, or of an exit marked back = true (no dead ends).
#   reached_by      for scenarios that happen to you rather than places you go to
#                   (errors, notifications, Minga asking): the event that shows it.
#                   The checker treats these as reachable.
#   outside_app     true for system surfaces such as a desktop notification.
#   transient       true for surfaces that exist to be acted on and closed
#                   (drawers, pickers, menus, prompts, which-key). Every exit on a
#                   transient surface needs both a key and a click, unless the exit
#                   sets keyboard_only = "<reason>".
#   list            true when the surface lists things. It must name its
#                   empty_state, a scenario id for the zero case.
#   terminal_state  true when the scenario ends the session (quit).
#   state_of        true for a state other scenarios can be in rather than a place you go to (a
#                   narrow window). It has no exits, no registry entry and no renders of its own; the
#                   scenarios it applies to and their checks prove it, and notes say where.
#   exit fields     key, click, to, plus optional keyboard_only (reason), back
#                   (true for an escape that is not esc or q, such as ⌃\ ⌃N in a
#                   terminal or ⌘W on a window) and note.
#
# Journeys:
#   start       launch, first run, open a project, quit
#   edit        editing and navigation in a file
#   search      search in buffer, project search, replace
#   code        completion, hover, signature help, diagnostics, code actions, rename, references
#   git         status, blame, hunks, conflicts, commit
#   minga       tasks, conversation, composer, queue, review, subagents, approvals
#   terminal    the built-in terminal and *minga-shell*
#   files       switcher, file tree, buffers, pinned files
#   windows     splits, drawers, focus, narrow windows
#   settings    config, themes, keybindings, extensions, help
#   errors      error notices, empty states, crashes, reconnects
#
# The inventory covers every screen and state found in the semantic UI builders,
# the macOS views, the Go TUI and the leader keymap, plus the empty states and
# lifecycle screens the Spine needs. Within a journey, removed scenarios come last.

# ---- start -----------------------------------------------------------------

# Design phase. "final" since the mouse sweep: every scenario has a click path, and
# missing click paths fail the checker. "keyboard" was the phase before the sweep.
phase = "final"

[[scenario]]
id = "start.empty"
journey = "start"
title = "minga outside any project: home with recent projects"
surfaces = ["home", "modeline"]
states = []
frontends = ["macos", "tui"]
status = "designed"
boards = { macos = "Batch6_start_empty.dc.html", tui = "Batch6_start_empty.dc.html" }
cold_start = true
home = true
exits = [
  { key = "1-9", click = "project row", to = "start.open_dir.restored" },
  { key = "↩", click = "project row", to = "start.open_dir.restored" },
  { key = "SPC SPC", click = "Find file", to = "files.project_find" },
  { key = "SPC p p", click = "Open project", to = "start.project_switcher" },
  { key = "SPC p a", click = "Add project", to = "start.project_switcher" },
  { key = "SPC p r", click = "Recent file", to = "start.recent_files" },
  { key = "SPC f f", click = "Switch file", to = "files.switcher" },
  { key = "SPC ,", click = "Switch file", to = "files.switcher" },
  { key = "SPC h T", click = "Tutorial", to = "settings.tutorial" },
  { key = "SPC q q", click = "window close button, ⌘Q or Minga › Quit (TUI: mode pill › Quit)", to = "start.quit.confirm" },
]
notes = "The cold-start scenario for reachability. *home* outside a project lists recent projects, numbered; 1 to 9 open one (restored session when it has one, otherwise its project home). A resting view: q does nothing."

[[scenario]]
id = "start.open_dir.home"
journey = "start"
title = "minga . in a project opened for the first time: project home"
surfaces = ["home", "modeline"]
states = ["working"]
frontends = ["macos", "tui"]
status = "designed"
boards = { macos = "Batch6_start_open_dir_home.dc.html", tui = "Batch6_start_open_dir_home.dc.html" }
home = true
reached_by = "minga . (or minga with no arguments) inside a project with no saved session"
exits = [
  { key = "1-9", click = "recent file row", to = "edit.plain" },
  { key = "↩", click = "file row", to = "edit.plain" },
  { key = "↩ on a task row", click = "task row", to = "minga.conversation" },
  { key = "SPC SPC", click = "Find file", to = "files.project_find" },
  { key = "SPC a n", click = "New task", to = "minga.task.new" },
  { key = "SPC o p", click = "File tree", to = "files.tree" },
  { key = "SPC p p", click = "Switch project", to = "start.project_switcher" },
]
notes = "*home*: project name and path, branch and change count, Recent in this project (1 to 9), this project's Minga tasks with state glyphs, next actions as an action list. A resting view: q does nothing. SPC p h returns here from anywhere."

[[scenario]]
id = "start.open_dir.restored"
journey = "start"
title = "minga . in a project with a saved session: picks up where you left off"
surfaces = ["editor", "modeline", "echo"]
states = ["working"]
frontends = ["macos", "tui"]
status = "designed"
boards = { macos = "Batch6_start_open_dir_restored.dc.html", tui = "Batch6_start_open_dir_restored.dc.html" }
home = true
reached_by = "minga . inside a project with a saved session"
exits = [
  { key = "SPC q n", click = "Start fresh", to = "start.open_dir.home" },
  { key = "SPC p h", click = "Project home", to = "start.open_dir.home" },
  { key = "any key", click = "", to = "edit.working" },
]
notes = "Files, splits, cursors and scroll come back; the echo says \"Restored 3 files from last time\" with SPC q n to start fresh. Start fresh closes the restored files and keeps Minga's tasks, unsaved edits and unreviewed changes. Minga's tasks are not part of the window session."

[[scenario]]
id = "start.open_dir.subdir"
journey = "start"
title = "minga lib/minga_agent inside a project: root found above, switcher filtered"
surfaces = ["drawer:switcher", "modeline"]
states = []
frontends = ["macos", "tui"]
status = "designed"
boards = { macos = "Batch6_start_open_dir_subdir.dc.html", tui = "Batch6_start_open_dir_subdir.dc.html" }
transient = true
reached_by = "minga <subdirectory> inside a project"
exits = [
  { key = "↩", click = "file row", to = "edit.plain" },
  { key = "⌃V", click = "Open in split button", to = "windows.split" },
  { key = "typing", click = "", to = "files.switcher", keyboard_only = "typing narrows the filter; backspace widens it to the whole project" },
  { key = "esc", click = "click outside", to = "start.open_dir.home", back = true },
]
notes = "The root is the nearest project marker above the directory; the switcher opens filtered to the subdirectory."

[[scenario]]
id = "start.open_dir.not_project"
journey = "start"
title = "minga . in a directory with no project markers"
surfaces = ["home", "modeline"]
states = []
frontends = ["macos", "tui"]
status = "designed"
