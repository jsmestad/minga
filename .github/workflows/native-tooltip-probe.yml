name: Native tooltip capability probe

on:
  push:
    branches: [diag/4053-native-tooltip]

jobs:
  tooltip:
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      MINGA_REQUIRE_METAL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict
      - uses: actions/download-artifact@v4
        with:
          name: storyboard-tui
          github-token: ${{ github.token }}
          run-id: 46141055312
          path: ${{ runner.temp }}/storyboard
      - run: mix deps.get
      - name: Install pinned XcodeGen
        run: scripts/install_xcodegen "$RUNNER_TEMP/xcodegen" >> "$GITHUB_PATH"
      - name: Build PreviewHost as in storyboard CI
        run: |
          mix protocol.gen
          (cd macos && xcodegen generate --quiet)
          xcodebuild build -project macos/Minga.xcodeproj -scheme PreviewHost -configuration Debug -derivedDataPath "$RUNNER_TEMP/derived" CODE_SIGNING_ALLOWED=NO -quiet
      - name: Verify the production modeline tooltip on the isolated display
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import time

          required = {"GITHUB_ACTIONS": "true", "CI": "true", "RUNNER_ENVIRONMENT": "github-hosted", "GITHUB_REF": "refs/heads/diag/4053-native-tooltip"}
          if any(os.environ.get(key) != value for key, value in required.items()):
              raise SystemExit("the launch probe requires the isolated diagnostic branch on a GitHub-hosted runner")

          root = Path(os.environ["RUNNER_TEMP"])
          transcript = root / "storyboard/transcripts/edit.working/macos-catppuccin_latte-1280.json"
          jobs = root / "tooltip-jobs.json"
          jobs.write_text(json.dumps([{"transcript": str(transcript), "output": str(root / "tooltip-frames/edit.working")}]))
          bundle = root / "derived/Build/Products/Debug/PreviewHost.app"
          executable = bundle / "Contents/MacOS/PreviewHost"
          stdout, stderr = root / "tooltip.stdout", root / "tooltip.stderr"
          activation = root / "tooltip-activation.pid"
          env = dict(required, MINGA_REQUIRE_METAL="1")
          env.update(PREVIEW_VIEW="Storyboard", PREVIEW_STORYBOARD_JOBS=str(jobs), MINGA_STORYBOARD_TOOLTIP_PROBE="1", MINGA_TOOLTIP_ACTIVATION_RECEIPT=str(activation), LC_ALL="en_US.UTF-8", TZ="UTC")
          with stdout.open("wb") as out, stderr.open("wb") as err:
              app = subprocess.Popen([str(executable)], env=env, stdout=out, stderr=err)
              try:
                  deadline = time.monotonic() + 15
                  while not activation.exists() and app.poll() is None and time.monotonic() < deadline:
                      time.sleep(0.05)
                  if not activation.exists() or activation.read_text() != str(app.pid) or app.poll() is not None:
                      raise SystemExit("the original PreviewHost did not present its activation receipt")
                  # A normal open reuses the already running bundle. Do not pass -n or rely on a replacement process.
                  subprocess.run(["/usr/bin/open", str(bundle)], env=env, check=True, timeout=5)
                  if app.wait(timeout=25) != 0:
                      raise SystemExit("the original PreviewHost failed the native tooltip observations")
              finally:
                  if app.poll() is None:
                      app.terminate()
                      try:
                          app.wait(timeout=2)
                      except subprocess.TimeoutExpired:
                          app.kill()
                          app.wait()
                  subprocess.run(["/usr/bin/pkill", "-TERM", "-f", f"^{re.escape(str(executable))}$"], check=False)
                  for log in (stdout, stderr):
                      print(log.read_text(), end="")
          if not stdout.exists() or "TOOLTIP_PROBE result=verified_owned_detached_help" not in stdout.read_text().splitlines():
              raise SystemExit("the original PreviewHost exited without verified native help and dismissal")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owned-tooltip-frames
          path: ${{ runner.temp }}/tooltip-frames
          if-no-files-found: ignore
          retention-days: 1
