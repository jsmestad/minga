name: Prepare Release Candidate

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full reviewed source SHA from protected main history
        required: true
        type: string
      version:
        description: Exact source/app version from mix.exs (no v prefix)
        required: true
        type: string

permissions:
  contents: read
  actions: read

env:
  MIX_ENV: prod
  ELIXIR_VERSION: "1.20.5-otp-29"
  OTP_VERSION: "29.1.2"
  GO_VERSION: "1.26.11"
  NATIVE_ZIG_VERSION: "0.16.0"
  RETENTION_DAYS: 14

jobs:
  validate:
    name: Validate immutable reviewed source and trusted workflow
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      version: ${{ steps.source.outputs.version }}
      context: ${{ steps.source.outputs.context }}
      python_version: ${{ steps.source.outputs.python_version }}
      matrix: ${{ steps.source.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind selected source to protected main and producing attempt
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          SOURCE_VERSION: ${{ inputs.version }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$WORKFLOW_SHA"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .protected)" = true
          git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/main
          git show "$SOURCE_SHA:mix.exs" > "$RUNNER_TEMP/source-mix.exs"
          git show "$SOURCE_SHA:.tool-versions" > "$RUNNER_TEMP/source-tool-versions"
          git show "$SOURCE_SHA:scripts/release_erts_sources.json" > "$RUNNER_TEMP/source-erts-inputs.json"
          if ! cmp -s scripts/release_erts_sources.json "$RUNNER_TEMP/source-erts-inputs.json"; then
            echo "Selected source does not match the trusted native release runtime pins" >&2
            exit 1
          fi
          python_version=$(jq -er '.build_python_version | select(type == "string")' "$RUNNER_TEMP/source-erts-inputs.json")
          [[ "$python_version" =~ ^3\.[0-9]+\.[0-9]+$ ]]
          SOURCE_VERSION=$(python3 - <<'PY'
          import os, pathlib, re
          source = pathlib.Path(os.environ['RUNNER_TEMP'], 'source-mix.exs').read_text()
          versions = re.findall(r'^\s*@version "([^"]+)"', source, re.M)
          assert len(versions) == 1, 'Missing unique source version'
          if os.environ["GITHUB_EVENT_NAME"] == "push":
              assert re.fullmatch(r"\d+\.\d+\.\d+", versions[0]), "Rolling builds require a numeric source version"
              print(versions[0] + "-dev." + os.environ["GITHUB_RUN_NUMBER"])
          else:
              assert versions == [os.environ["SOURCE_VERSION"]], "Source/app version mismatch"
              print(versions[0])
          pins = dict(line.split() for line in pathlib.Path(os.environ['RUNNER_TEMP'], 'source-tool-versions').read_text().splitlines() if line.strip())
          assert pins == {'elixir': os.environ['ELIXIR_VERSION'], 'erlang': os.environ['OTP_VERSION'], 'zig': os.environ['NATIVE_ZIG_VERSION'], 'golang': os.environ['GO_VERSION']}, 'Source tool pins differ from trusted preparation pins'
          PY
          )
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/run.json"
          jq -e --arg sha "$WORKFLOW_SHA" --arg event "$GITHUB_EVENT_NAME" --argjson attempt "$GITHUB_RUN_ATTEMPT" --argjson number "$GITHUB_RUN_NUMBER" '.head_sha == $sha and .run_attempt == $attempt and .run_number == $number and .event == $event and .path == ".github/workflows/release.yml"' "$RUNNER_TEMP/run.json"
          context=$(jq -cn --arg repository "$GITHUB_REPOSITORY" --arg source_sha "$SOURCE_SHA" --arg version "$SOURCE_VERSION" --arg workflow_sha "$WORKFLOW_SHA" --argjson run_id "$GITHUB_RUN_ID" --argjson run_attempt "$GITHUB_RUN_ATTEMPT" --arg started "$(jq -r .run_started_at "$RUNNER_TEMP/run.json")" '{repository:$repository,source_sha:$source_sha,version:$version,workflow_path:".github/workflows/release.yml",workflow_sha:$workflow_sha,run_id:$run_id,run_attempt:$run_attempt,run_started_at:$started}')
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            test "$SOURCE_SHA" = "$WORKFLOW_SHA"
            context=$(jq -c '. + {channel:"homebrew"}' <<< "$context")
          fi
          matrix=$(jq -c --arg event "$GITHUB_EVENT_NAME" '{include: (if $event == "push" then map(select(.os == "macos" and .arch == "aarch64")) else . end)}' .github/release-targets.json)
          {
            printf 'matrix=%s\n' "$matrix"
            printf 'source_sha=%s\nversion=%s\ncontext=%s\n' "$SOURCE_SHA" "$SOURCE_VERSION" "$context"
            printf 'python_version=%s\n' "$python_version"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Prepare ${{ matrix.filename }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}
    # Only new pushes compete, one group per payload. Never cancel publication here.
    concurrency:
      group: release-candidate-build-${{ github.event_name == 'push' && github.run_attempt == '1' && github.ref || github.run_id }}-${{ matrix.filename }}
      cancel-in-progress: true
    defaults:
      run:
        shell: bash
        working-directory: source
    env:
      PYTHON_VERSION: ${{ needs.validate.outputs.python_version }}
      TARGET_OS: ${{ matrix.os }}
      TARGET_ARCH: ${{ matrix.arch }}
      GOARCH: ${{ matrix.goarch }}
      GOTOOLCHAIN: local
      CANDIDATE_CONTEXT: ${{ needs.validate.outputs.context }}
      PAYLOAD: ${{ matrix.filename }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          path: source
          persist-credentials: false
      - name: Isolate runtime and tool caches; verify native host
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(jq -r .source_sha <<< "$CANDIDATE_CONTEXT")"
          if [ "$(jq -r '.channel // ""' <<< "$CANDIDATE_CONTEXT")" = homebrew ]; then
            printf 'MINGA_ROLLING_VERSION=%s\n' "$(jq -r .version <<< "$CANDIDATE_CONTEXT")" >> "$GITHUB_ENV"
          fi
          test "$(uname -m)" = '${{ matrix.uname }}'
          if [ "$TARGET_OS" = macos ]; then test "$(uname -s)" = Darwin; else test "$(uname -s)" = Linux; fi
          root="$RUNNER_TEMP/candidate-$PAYLOAD"
          mkdir -p "$root"/{home,config,data,cache,state,tmp,mix,hex,rebar,zig,go-build,go-mod,out}
          printf 'CANDIDATE_RUNNER_HOME=%s\n' "$HOME" >> "$GITHUB_ENV"
          for entry in "HOME=home" "XDG_CONFIG_HOME=config" "XDG_DATA_HOME=data" "XDG_CACHE_HOME=cache" "XDG_STATE_HOME=state" "TMPDIR=tmp" "MIX_HOME=mix" "HEX_HOME=hex" "REBAR_CACHE_DIR=rebar" "ZIG_GLOBAL_CACHE_DIR=zig" "GOCACHE=go-build" "GOMODCACHE=go-mod"; do
            printf '%s=%s/%s\n' "${entry%%=*}" "$root" "${entry#*=}" >> "$GITHUB_ENV"
          done
          printf 'CANDIDATE_ROOT=%s\n' "$root" >> "$GITHUB_ENV"
          printf '%s\n' "$CANDIDATE_CONTEXT" > "$root/context.json"
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.NATIVE_ZIG_VERSION }}
      - name: Select supported Xcode explicitly
        if: matrix.os == 'macos'
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
      - name: Verify actual native toolchains
        run: |
          set -euo pipefail
          test "$(elixir -e 'IO.write(System.version())')" = "${ELIXIR_VERSION%-otp-*}"
          otp=$(elixir -e 'IO.write(File.read!(Path.join([:code.root_dir(), "releases", :erlang.system_info(:otp_release), "OTP_VERSION"])))')
          test "$otp" = "$OTP_VERSION"
          beam_arch=$(elixir -e 'IO.write(:erlang.system_info(:system_architecture))')
          case "$beam_arch" in "$TARGET_ARCH"-*) ;; *) echo "Wrong host ERTS architecture: $beam_arch" >&2; exit 1;; esac
          test "$(go env GOVERSION)" = "go$GO_VERSION"
          test "$(go env GOHOSTARCH)" = '${{ matrix.goarch }}'
          test "$(go env GOARCH)" = '${{ matrix.goarch }}'
          test "$(zig version)" = "$NATIVE_ZIG_VERSION"
          erts=$(elixir -e 'IO.write(:erlang.system_info(:version))')
          printf 'EXPECTED_ERTS=%s\n' "$erts" >> "$GITHUB_ENV"
          jq -n --arg elixir "$(elixir -e 'IO.write(System.version())')-otp-$(elixir -e 'IO.write(:erlang.system_info(:otp_release))')" --arg otp "$otp" --arg go "$(go env GOVERSION | cut -c 3-)" --arg zig "$(zig version)" --arg host "$beam_arch" --arg erts "$erts" '{elixir:$elixir,otp:$otp,go:$go,native_zig:$zig,host_erts_arch:$host,erts:$erts}' > "$CANDIDATE_ROOT/toolchains.json"
          mix local.hex --force
          mix local.rebar --force
          mix deps.get --only prod
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Verify safe-extraction Python
        run: |
          set -euo pipefail
          python3 -c 'import os, platform, tarfile; assert platform.python_version() == os.environ["PYTHON_VERSION"]; assert callable(tarfile.data_filter)'
          jq --arg python "$(python3 -c 'import platform; print(platform.python_version())')" '. + {python:$python}' "$CANDIDATE_ROOT/toolchains.json" > "$CANDIDATE_ROOT/toolchains.next.json"
          mv "$CANDIDATE_ROOT/toolchains.next.json" "$CANDIDATE_ROOT/toolchains.json"
      - name: Install native Ubuntu build prerequisites
        if: matrix.os == 'linux'
        run: |
          set -euo pipefail
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = 24.04
          test "$(getconf GNU_LIBC_VERSION)" = 'glibc 2.39'
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential binutils perl ca-certificates
      - name: Build native Go and Zig with repository pins
        if: '!matrix.gui'
        run: |
          set -euo pipefail
          # A present but empty value disables Exqlite's precompiler while its
          # Makefile still builds the vendored SQLite sources, not system libsqlite3.
          if [ "$TARGET_OS" = linux ]; then export EXQLITE_USE_SYSTEM=; fi
          mix native.build.tui
          mix compile --warnings-as-errors
      - name: Build and qualify the pinned local ERTS input
        if: '!matrix.gui'
        run: |
          set -euo pipefail
          python3 scripts/build-release-erts.py --os "$TARGET_OS" --arch "$TARGET_ARCH" --output "$CANDIDATE_ROOT/erts-input"
          receipt="$CANDIDATE_ROOT/erts-input/receipt.json"
          test -s "$receipt"
          printf 'MINGA_RELEASE_ERTS_RECEIPT=%s\n' "$receipt" >> "$GITHUB_ENV"
          jq --slurpfile runtime "$receipt" '. + {erts_source:$runtime[0]}' "$CANDIDATE_ROOT/toolchains.json" > "$CANDIDATE_ROOT/toolchains.next.json"
          mv "$CANDIDATE_ROOT/toolchains.next.json" "$CANDIDATE_ROOT/toolchains.json"
      - name: Archive exactly one native Mix release
        if: '!matrix.gui'
        run: |
          set -euo pipefail
          mix release.tui --no-compile --overwrite
          COPYFILE_DISABLE=1 tar -C _build/prod/rel -czf "$CANDIDATE_ROOT/out/$PAYLOAD" minga
      - name: Extract, inspect, and boot final standalone tarball bytes
        if: '!matrix.gui'
        run: |
          set -euo pipefail
          unpacked="$CANDIDATE_ROOT/unpacked release"
          mkdir "$unpacked"
          python3 - "$CANDIDATE_ROOT/out/$PAYLOAD" "$unpacked" <<'PY'
          import sys
          import tarfile
          from pathlib import PurePosixPath

          def package_member(member, destination):
              parts = PurePosixPath(member.name).parts
              if parts[:1] != ("minga",) or ".." in parts:
                  raise ValueError(f"Unexpected native release archive path: {member.name}")
              if len(parts) == 1 and not member.isdir():
                  raise ValueError("Native release archive root must be the minga directory")
              return tarfile.data_filter(member, destination)

          with tarfile.open(sys.argv[1], "r:gz") as archive:
              archive.extractall(sys.argv[2], filter=package_member)
          PY
          package="$unpacked/minga"
          "$GITHUB_WORKSPACE/trusted/scripts/check-release-contents" "$package" --target "${TARGET_OS}_${TARGET_ARCH}" --runtime-receipt "$MINGA_RELEASE_ERTS_RECEIPT"
          cd "$CANDIDATE_ROOT"
          smoke_env=(env -i HOME="$HOME" PATH=/usr/bin:/bin TMPDIR="$TMPDIR"
            XDG_CONFIG_HOME="$XDG_CONFIG_HOME" XDG_DATA_HOME="$XDG_DATA_HOME"
            XDG_CACHE_HOME="$XDG_CACHE_HOME" XDG_STATE_HOME="$XDG_STATE_HOME")
          "${smoke_env[@]}" "$package/launchers/minga" --version > version.txt
          grep -Fx "minga $(jq -r .version context.json)" version.txt
          if [[ "$TARGET_OS" == linux ]]; then
            parser=$(find "$package/lib" -type f -path '*/priv/minga-parser' -print)
            test -x "$parser"
            "${smoke_env[@]}" "$parser" < /dev/null > /dev/null
          fi
          export RELEASE_DISTRIBUTION=none
          RELEASE_COOKIE=$(openssl rand -hex 32)
          export RELEASE_COOKIE
          "$package/bin/minga" eval 'erts = to_string(:erlang.system_info(:version)); arch = to_string(:erlang.system_info(:system_architecture)); if erts != System.fetch_env!("EXPECTED_ERTS") or not String.starts_with?(arch, System.fetch_env!("TARGET_ARCH") <> "-"), do: raise("Packaged ERTS version/architecture mismatch"); {:ok, _} = Application.ensure_all_started(:crypto); if :crypto.hash(:sha256, "minga-package-probe") != <<0x1b45baf6461706ab791b75f5a031660a827efc4f51980372da69e5217d1d5257::256>>, do: raise("Packaged crypto NIF result mismatch"); {:ok, db} = Exqlite.Sqlite3.open(":memory:"); :ok = Exqlite.Sqlite3.close(db); IO.puts("packaged ERTS, crypto and SQLite NIFs " <> erts <> " " <> arch)'
      - name: Install pinned XcodeGen
        if: matrix.gui
        run: '"$GITHUB_WORKSPACE/trusted/scripts/install_xcodegen" "$CANDIDATE_ROOT/xcodegen" >> "$GITHUB_PATH"'
      - name: Assemble authoritative plain-release app product
        if: matrix.gui
        run: |
          set -euo pipefail
          mix app.assemble --output-path-file "$CANDIDATE_ROOT/app-path"
          IFS= read -r app < "$CANDIDATE_ROOT/app-path"
          [[ "$app" = /*/Minga.app ]]
          if [ -n "${MINGA_ROLLING_VERSION:-}" ]; then
            "$GITHUB_WORKSPACE/trusted/scripts/stamp-rolling-app" "$app" "$MINGA_ROLLING_VERSION"
          fi
          version_args=(--target macos_aarch64 --app "$app")
          if [ -n "${MINGA_ROLLING_VERSION:-}" ]; then version_args+=(--rolling-version "$MINGA_ROLLING_VERSION"); fi
          "$GITHUB_WORKSPACE/trusted/scripts/check-release-contents" "$app/Contents/Resources/release" "${version_args[@]}"
          xcodebuild -version > "$CANDIDATE_ROOT/xcode.txt"
          jq --arg xcode "$(cat "$CANDIDATE_ROOT/xcode.txt")" '. + {xcode:$xcode}' "$CANDIDATE_ROOT/toolchains.json" > "$CANDIDATE_ROOT/toolchains.next.json"
          mv "$CANDIDATE_ROOT/toolchains.next.json" "$CANDIDATE_ROOT/toolchains.json"
      # Apple credentials exist only in these trusted, reviewed signing/notary steps.
      - name: Import temporary Developer ID signing identity
        if: matrix.gui
        env:
          DEVELOPER_ID_CERT: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          DEVELOPER_ID_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          # macOS resolves user keychain preferences through HOME.
          export HOME="$CANDIDATE_RUNNER_HOME"
          test -n "$DEVELOPER_ID_CERT"
          test -n "$DEVELOPER_ID_PASSWORD"
          keychain="$RUNNER_TEMP/candidate-signing.keychain-db"
          password=$(openssl rand -base64 32)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          cert="$RUNNER_TEMP/candidate-certificate.p12"
          trap 'rm -f "$cert"' EXIT
          printf '%s' "$DEVELOPER_ID_CERT" | base64 --decode > "$cert"
          # The partition list does not grant codesign access to the private key.
          security import "$cert" -P "$DEVELOPER_ID_PASSWORD" -t cert -f pkcs12 -k "$keychain" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain"
      - name: Sign every native component and app, failing on every signing error
        if: matrix.gui
        timeout-minutes: 20
        run: |
          set -euo pipefail
          export HOME="$CANDIDATE_RUNNER_HOME"
          IFS= read -r app < "$CANDIDATE_ROOT/app-path"
          keychain="$RUNNER_TEMP/candidate-signing.keychain-db"
          identity=$(security find-identity -v -p codesigning "$keychain" | ruby -e 'STDIN.each_line { |line| match = /\b([0-9A-F]{40})\s+"Developer ID Application/.match(line); puts match[1] if match }')
          if [[ ! "$identity" =~ ^[0-9A-F]{40}$ ]]; then
            echo "Expected exactly one valid Developer ID Application identity in the temporary keychain" >&2
            exit 1
          fi
          echo "Checking Developer ID private-key access without a timestamp request"
          probe=$(mktemp -d "$RUNNER_TEMP/candidate-signing-probe.XXXXXX")
          trap 'rm -rf "$probe"' EXIT
          cp /bin/echo "$probe/echo"
          /usr/bin/codesign --force --keychain "$keychain" --timestamp=none --sign "$identity" "$probe/echo"
          codesign --verify --strict "$probe/echo"

          entitlements="$GITHUB_WORKSPACE/source/macos/Entitlements.plist"
          while IFS= read -r -d '' file; do
            if file -b "$file" | grep -q 'Mach-O'; then
              printf 'Signing native component: %s\n' "${file#"$app/"}"
              /usr/bin/codesign --force --keychain "$keychain" --options runtime --entitlements "$entitlements" --sign "$identity" "$file"
              codesign --verify --strict "$file"
            fi
          done < <(find "$app/Contents" -type f -print0)
          echo "Signing Minga.app"
          /usr/bin/codesign --force --keychain "$keychain" --options runtime --entitlements "$entitlements" --sign "$identity" "$app"
          codesign --verify --deep --strict "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | grep -F 'Authority=Developer ID Application'
          echo "Creating Minga.dmg"
          hdiutil create -volname Minga -srcfolder "$app" -ov -format UDZO "$CANDIDATE_ROOT/out/Minga.dmg"
          echo "Signing Minga.dmg"
          /usr/bin/codesign --force --keychain "$keychain" --sign "$identity" "$CANDIDATE_ROOT/out/Minga.dmg"
          codesign --verify --strict "$CANDIDATE_ROOT/out/Minga.dmg"
      - name: Notarize and staple final DMG
        if: matrix.gui
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcrun notarytool submit "$CANDIDATE_ROOT/out/Minga.dmg" --apple-id "$APPLE_ID" --password "$APPLE_ID_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait --output-format json > "$CANDIDATE_ROOT/notary.json"
          jq -e '.status == "Accepted"' "$CANDIDATE_ROOT/notary.json"
          xcrun stapler staple "$CANDIDATE_ROOT/out/Minga.dmg"
          xcrun stapler validate "$CANDIDATE_ROOT/out/Minga.dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$CANDIDATE_ROOT/out/Minga.dmg"
      - name: Inspect and boot the final signed stapled DMG package
        if: matrix.gui
        run: |
          set -euo pipefail
          RELEASE_COOKIE=$(openssl rand -hex 32)
          export RELEASE_COOKIE
          export RELEASE_DISTRIBUTION=none
          mount="$CANDIDATE_ROOT/mounted"
          mkdir "$mount"
          ipc_parent=""
          cleanup() {
            local status=$?
            if [[ -n "$ipc_parent" ]]; then rmdir "$ipc_parent" || status=1; fi
            hdiutil detach "$mount" || status=1
            return "$status"
          }
          trap cleanup EXIT
          hdiutil attach "$CANDIDATE_ROOT/out/Minga.dmg" -mountpoint "$mount" -nobrowse -readonly
          app="$mount/Minga.app"
          codesign --verify --deep --strict "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | grep -F 'Authority=Developer ID Application'
          version_args=(--target macos_aarch64 --app "$app")
          if [ -n "${MINGA_ROLLING_VERSION:-}" ]; then version_args+=(--rolling-version "$MINGA_ROLLING_VERSION"); fi
          "$GITHUB_WORKSPACE/trusted/scripts/check-release-contents" "$app/Contents/Resources/release" "${version_args[@]}"
          helper="$app/Contents/Resources/bin/minga-ipc"
          codesign --verify --strict "$helper"
          ipc_parent=$(mktemp -d /private/tmp/minga-ipc.XXXXXXXX)
          "$helper" nonce | grep -E '^[0-9a-f-]{36}$'
          # Historic helpers reject the flag before inspecting any endpoint.
          # Current helpers distinguish a bad override (4) from an empty private parent (3).
          capability_status=0
          "$helper" probe --runtime-parent "$ipc_parent/absent" || capability_status=$?
          case "$capability_status" in
            4)
              probe_status=0
              "$helper" probe --runtime-parent "$ipc_parent" || probe_status=$?
              test "$probe_status" = 3
              ;;
            1)
              echo 'Packaged helper does not support private IPC probing; checked nonce and argument rejection only.'
              ;;
            *)
              echo "Unexpected isolated IPC capability response: $capability_status" >&2
              exit 1
              ;;
          esac
          MINGA_APP_PATH="$app" RELEASE_TMP="$CANDIDATE_ROOT/release-smoke" "$app/Contents/Resources/bin/minga-tui" --version > "$CANDIDATE_ROOT/version.txt"
          grep -Fx "minga $(jq -r .version "$CANDIDATE_ROOT/context.json")" "$CANDIDATE_ROOT/version.txt"
          MINGA_APP_PATH="$app" "$app/Contents/Resources/bin/minga" --version > "$CANDIDATE_ROOT/gui-version.txt"
          cmp "$CANDIDATE_ROOT/version.txt" "$CANDIDATE_ROOT/gui-version.txt"
          "$app/Contents/Resources/release/bin/minga_macos" eval 'erts = to_string(:erlang.system_info(:version)); arch = to_string(:erlang.system_info(:system_architecture)); if erts != System.fetch_env!("EXPECTED_ERTS") or not String.starts_with?(arch, "aarch64-"), do: raise("Packaged ERTS version/architecture mismatch"); {:ok, _} = Application.ensure_all_started(:crypto); if :crypto.hash(:sha256, "minga-package-probe") != <<0x1b45baf6461706ab791b75f5a031660a827efc4f51980372da69e5217d1d5257::256>>, do: raise("Packaged crypto NIF result mismatch"); {:ok, db} = Exqlite.Sqlite3.open(":memory:"); :ok = Exqlite.Sqlite3.close(db); IO.puts("packaged ERTS, crypto and SQLite NIFs " <> erts <> " " <> arch)'
      - name: Record actual successful package evidence
        run: |
          set -euo pipefail
          evidence='[{"id":"package-contents","result":"passed"},{"id":"native-architecture","result":"passed"},{"id":"package-boot","result":"passed","scope":"version command, packaged ERTS eval, fixed-result OTP crypto hash and in-memory SQLite NIF open/close; not installed/UI/X0 qualification"}]'
          if [ "$PAYLOAD" = Minga.dmg ]; then
            evidence=$(jq -c '. + [{id:"signature",result:"passed"},{id:"notarization",result:"passed"},{id:"stapling",result:"passed"}]' <<< "$evidence")
          else
            evidence=$(jq -c '. + [{id:"package-runtime-abi",result:"passed"}]' <<< "$evidence")
          fi
          jq -n --slurpfile context "$CANDIDATE_ROOT/context.json" --slurpfile tools "$CANDIDATE_ROOT/toolchains.json" --arg filename "$PAYLOAD" --arg os "$TARGET_OS" --arg arch "$TARGET_ARCH" --argjson evidence "$evidence" '{schema_version:1,context:$context[0],filename:$filename,target:{os:$os,arch:$arch},toolchains:$tools[0],evidence:$evidence}' > "$CANDIDATE_ROOT/out/$PAYLOAD.build.json"
      - name: Upload immutable payload and sanitized evidence
        uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.filename }}
          path: ${{ env.CANDIDATE_ROOT }}/out/*
          if-no-files-found: error
          retention-days: ${{ env.RETENTION_DAYS }}
          compression-level: 0
          overwrite: false
      - name: Preserve sanitized partial diagnostics only
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-only-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.filename }}
          path: |
            ${{ env.CANDIDATE_ROOT }}/context.json
            ${{ env.CANDIDATE_ROOT }}/toolchains.json
            ${{ env.CANDIDATE_ROOT }}/version.txt
            ${{ env.CANDIDATE_ROOT }}/erts-input/**/command-*.log
          if-no-files-found: ignore
          retention-days: ${{ env.RETENTION_DAYS }}
      - name: Remove temporary Apple keychain and certificate
        if: always() && matrix.gui
        run: |
          set -euo pipefail
          export HOME="${CANDIDATE_RUNNER_HOME:-$HOME}"
          keychain="$RUNNER_TEMP/candidate-signing.keychain-db"
          if [ -f "$keychain" ]; then security delete-keychain "$keychain"; fi
          rm -f "$RUNNER_TEMP/candidate-certificate.p12"

  finalize:
    name: Verify uploaded final bytes and bind immutable candidate handle
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      recipe_artifact_id: ${{ steps.homebrew-recipes.outputs.artifact-id }}
      manifest_id: ${{ steps.manifest.outputs.artifact-id }}
      manifest_sha: ${{ steps.verify.outputs.manifest_sha }}
    env:
      CANDIDATE_CONTEXT: ${{ needs.validate.outputs.context }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Download actual immutable payload archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir downloads
          printf '%s\n' "$CANDIDATE_CONTEXT" > context.json
          source_sha=$(jq -er '.source_sha | select(test("^[0-9a-f]{40}$"))' context.json)
          gh api -H 'Accept: application/vnd.github.raw+json' "repos/$GITHUB_REPOSITORY/contents/.tool-versions?ref=$source_sha" > source.tool-versions
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" | jq --arg prefix "candidate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-" '[.[].artifacts[] | select(.name | startswith($prefix))]' > artifacts.json
          while IFS= read -r id; do
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "downloads/$id.zip"
          done < <(jq -r '.[].id' artifacts.json)
          python3 scripts/release_candidate.py checksums --context context.json --artifacts artifacts.json --downloads downloads --source-tool-versions source.tool-versions --output SHA256SUMS.txt
      - name: Upload exact final-payload checksums
        id: checksums
        uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ github.run_id }}-${{ github.run_attempt }}-checksums
          path: SHA256SUMS.txt
          if-no-files-found: error
          retention-days: ${{ env.RETENTION_DAYS }}
          overwrite: false
      - name: Download checksum archive and construct versioned manifest
        env:
          CHECKSUM_ID: ${{ steps.checksums.outputs.artifact-id }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$CHECKSUM_ID" > checksum-artifact.json
          jq --slurpfile artifact checksum-artifact.json '. + $artifact' artifacts.json > artifacts.next.json
          mv artifacts.next.json artifacts.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$CHECKSUM_ID/zip" > "downloads/$CHECKSUM_ID.zip"
          python3 scripts/release_candidate.py create --context context.json --artifacts artifacts.json --downloads downloads --source-tool-versions source.tool-versions --output manifest.json
      - name: Upload immutable manifest (external handle; never self-hashed)
        id: manifest
        uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ github.run_id }}-${{ github.run_attempt }}-manifest
          path: manifest.json
          if-no-files-found: error
          retention-days: ${{ env.RETENTION_DAYS }}
          overwrite: false
      - name: Re-download manifest and verify the complete generation
        id: verify
        env:
          MANIFEST_ID: ${{ steps.manifest.outputs.artifact-id }}
        shell: bash
        run: |
          set -euo pipefail
          manifest_sha=$(sha256sum manifest.json | cut -d ' ' -f 1)
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$MANIFEST_ID" > manifest-artifact.json
          jq --slurpfile artifact manifest-artifact.json '. + $artifact' artifacts.json > artifacts.next.json
          mv artifacts.next.json artifacts.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$MANIFEST_ID/zip" > "downloads/$MANIFEST_ID.zip"
          python3 scripts/release_candidate.py verify --context context.json --artifacts artifacts.json --downloads downloads --source-tool-versions source.tool-versions --manifest-artifact-id "$MANIFEST_ID" --manifest-sha256 "$manifest_sha" --receipt preparation-receipt.json
          printf 'manifest_sha=%s\n' "$manifest_sha" >> "$GITHUB_OUTPUT"
          {
            echo '### Complete immutable preparation (not installed/UI/X0 qualification)'
            printf 'Manifest artifact ID: %s\n\nManifest-file SHA256: %s\n\n' "$MANIFEST_ID" "$manifest_sha"
            printf 'Source: %s; workflow revision: %s; run/attempt: %s/%s\n\n' "$(jq -r .source_sha context.json)" "$(jq -r .workflow_sha context.json)" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'Version: %s\n\n' "$(jq -r .version context.json)"
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
            echo 'Use this exact handle for independent read-only verification.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain bounded successful preparation receipt
        uses: actions/upload-artifact@v4
        with:
          name: preparation-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: preparation-receipt.json
          if-no-files-found: error
          retention-days: ${{ env.RETENTION_DAYS }}
          overwrite: false
      - name: Render unpublished Homebrew recipes from verified payloads
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          mkdir homebrew-input
          jq -r '.payloads[] | [.artifact.id, .filename] | @tsv' manifest.json > payload-locations.tsv
          while IFS=$'\t' read -r id name; do
            unzip -p "downloads/$id.zip" "$name" > "homebrew-input/$name"
          done < payload-locations.tsv
          (cd homebrew-input && sha256sum --check ../SHA256SUMS.txt)
          scripts/render-tui-formula --version "$(jq -er .version context.json)" \
            --arm64 homebrew-input/minga_macos_aarch64.tar.gz \
            --dmg homebrew-input/Minga.dmg --output homebrew-recipes
          cp preparation-receipt.json manifest.json homebrew-recipes/
      - name: Retain unpublished Homebrew recipes and candidate receipt
        if: github.event_name == 'push'
        id: homebrew-recipes
        uses: actions/upload-artifact@v4
        with:
          name: homebrew-recipes-${{ github.run_id }}-${{ github.run_attempt }}
          path: homebrew-recipes/
          if-no-files-found: error
          retention-days: ${{ env.RETENTION_DAYS }}
          overwrite: false

  publish-homebrew:
    name: Publish rolling Homebrew packages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'jsmestad/minga'
    needs: [validate, finalize]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: rolling-homebrew-publication
      cancel-in-progress: false
      queue: max
    permissions:
      actions: read
      contents: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
      CANDIDATE_CONTEXT: ${{ needs.validate.outputs.context }}
      MANIFEST_ID: ${{ needs.finalize.outputs.manifest_id }}
      MANIFEST_SHA: ${{ needs.finalize.outputs.manifest_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.finalize.outputs.recipe_artifact_id }}
          path: recipes
          merge-multiple: true
      - name: Stage the exact verified payloads and recipes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/stage-homebrew-publication.py recipes bundle payload-downloads
      - name: Preflight tap access and check its current generation
        id: tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          state=$(scripts/publish-homebrew-tap prepare bundle "$VERSION" "$SOURCE_SHA" "$RUNNER_TEMP/homebrew-tap")
          case "$state" in publish|current|stale) ;; *) exit 1 ;; esac
          printf 'state=%s\n' "$state" >> "$GITHUB_OUTPUT"
          if [[ $state == stale ]]; then
            echo 'Skipped: the Homebrew tap already has a newer release.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Make the verified immutable prerelease available
        if: steps.tap.outputs.state != 'stale'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_RELEASE_TOKEN || github.token }}
        run: scripts/publish-homebrew-release bundle "$VERSION" "$SOURCE_SHA"
      - name: Advance the formula and cask in one tap commit
        if: steps.tap.outputs.state == 'publish'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: scripts/publish-homebrew-tap push bundle "$VERSION" "$SOURCE_SHA" "$RUNNER_TEMP/homebrew-tap"
