name: Site & Docs Preview

on:
  pull_request:
    paths:
      - "site/**"
      - "wrangler.jsonc"
      - "docs/**"
      - "assets/**"
      - "mix.exs"
      - "README.md"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - "scripts/build_site.sh"
      - "scripts/check_site_links.py"
      - "test/scripts/check_site_links_test.py"
      - ".github/workflows/site.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "wrangler.jsonc"
      - "docs/**"
      - "assets/**"
      - "mix.exs"
      - "README.md"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - "scripts/build_site.sh"
      - "scripts/check_site_links.py"
      - "test/scripts/check_site_links_test.py"
      - ".github/workflows/site.yml"
  workflow_dispatch:

concurrency:
  group: site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  deployments: write

jobs:
  build-and-preview:
    name: Build & Preview Site
    runs-on: ubuntu-latest
    env:
      MINGA_SKIP_GO_TUI_BUILD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: deps-site-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ hashFiles('mix.lock') }}
          restore-keys: deps-site-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-

      - name: Test site link verifier
        run: python3 -m unittest discover -s test/scripts -p 'check_site_links_test.py' -v

      - name: Install Elixir dependencies
        run: mix deps.get

      - name: Assemble combined site and ExDoc bundle
        run: scripts/build_site.sh _site

      - name: Verify internal links, redirects, headers, and staging noindex
        run: python3 scripts/check_site_links.py _site --expect-noindex

      - name: Determine Cloudflare Workers deploy mode
        id: target
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REF_NAME: ${{ github.ref }}
          COMMIT_SHA: ${{ github.sha }}
          IS_SAME_REPO: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if [[ "$IS_SAME_REPO" != "true" || -z "$CF_TOKEN" || -z "$CF_ACCOUNT" ]]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Cloudflare Workers deploy (fork PR or Cloudflare secrets not configured)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "should_deploy=true" >> "$GITHUB_OUTPUT"

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "mode=preview" >> "$GITHUB_OUTPUT"
            echo "preview_name=pr-${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          elif [[ "$REF_NAME" == "refs/heads/main" ]]; then
            echo "mode=deploy" >> "$GITHUB_OUTPUT"
          else
            echo "mode=preview" >> "$GITHUB_OUTPUT"
            echo "preview_name=manual-${COMMIT_SHA:0:7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Worker preview (PR or non-main dispatch)
        id: preview
        if: steps.target.outputs.should_deploy == 'true' && steps.target.outputs.mode == 'preview'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.136.3"
          command: preview --name ${{ steps.target.outputs.preview_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy Worker staging production (main)
        id: deploy
        if: steps.target.outputs.should_deploy == 'true' && steps.target.outputs.mode == 'deploy'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.136.3"
          command: deploy
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Record deployment URLs in workflow summary
        if: steps.target.outputs.should_deploy == 'true'
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview-url }}
          PREVIEW_IMMUTABLE_URL: ${{ steps.preview.outputs.preview-deployment-url }}
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          {
            echo "### Cloudflare Workers Static Assets"
            if [[ -n "$PREVIEW_URL" ]]; then
              echo "- Preview URL: ${PREVIEW_URL}"
            fi
            if [[ -n "$PREVIEW_IMMUTABLE_URL" ]]; then
              echo "- Immutable preview deployment: ${PREVIEW_IMMUTABLE_URL}"
            fi
            if [[ -n "$DEPLOY_URL" ]]; then
              echo "- Staging URL: ${DEPLOY_URL}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
