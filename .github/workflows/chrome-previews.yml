name: Chrome preview evidence

on:
  pull_request:
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Main/base revision to capture before the migration"
        required: true
        default: "main"

permissions:
  contents: read

concurrency:
  group: chrome-previews-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect preview changes
    runs-on: ubuntu-latest
    outputs:
      capture_required: ${{ steps.paths.outputs.capture_required }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Decide whether captures are required
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess

          event = os.environ["EVENT_NAME"]
          if event == "workflow_dispatch":
              required = True
          elif event == "pull_request":
              changed = subprocess.check_output([
                  "git", "diff", "--name-only", "--no-renames", "-z",
                  f'{os.environ["BASE_SHA"]}..{os.environ["HEAD_SHA"]}', "--",
              ]).split(b"\0")
              relevant_files = {
                  b"scripts/preview.sh",
                  b"scripts/chrome_preview_evidence.py",
                  b"scripts/chrome_token_migration.json",
                  b"test/scripts/chrome_preview_evidence_test.py",
                  b".github/workflows/chrome-previews.yml",
              }
              required = any(
                  path.startswith(b"macos/") or path in relevant_files
                  for path in changed
              )
          else:
              raise SystemExit(f"Unsupported preview event: {event}")

          value = "true" if required else "false"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"capture_required={value}\n")
          print(f"Preview capture required: {value}")
          PY

  evidence:
    name: Same-runner before and after captures
    needs: detect-changes
    if: ${{ needs.detect-changes.result == 'success' && needs.detect-changes.outputs.capture_required == 'true' }}
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          path: after
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # A separate base checkout preserves actual before production views.
      # Fixtures and the preview-only target-membership repair are installed below.
      - uses: actions/checkout@v4
        with:
          path: before
          ref: ${{ github.event.pull_request.base.sha || inputs.base_ref }}

      - uses: erlef/setup-beam@v1
        with:
          version-file: after/.tool-versions
          version-type: strict

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned XcodeGen and image tooling
        run: |
          after/scripts/install_xcodegen "$RUNNER_TEMP/xcodegen" >> "$GITHUB_PATH"
          python3 -m pip install Pillow==11.3.0

      - name: Test preview evidence accounting
        run: python3 -m unittest discover -s after/test/scripts -p chrome_preview_evidence_test.py

      - name: Generate both revisions' protocol sources
        run: |
          (cd before && mix deps.get && mix protocol.gen)
          (cd after && mix deps.get && mix protocol.gen)
          mkdir -p "$RUNNER_TEMP/chrome-previews/before" "$RUNNER_TEMP/chrome-previews/after"
          sw_vers > "$RUNNER_TEMP/chrome-previews/runner.txt"
          xcodebuild -version >> "$RUNNER_TEMP/chrome-previews/runner.txt"
          cp after/scripts/chrome_token_migration.json "$RUNNER_TEMP/chrome-previews/"

      - name: Install identical fixtures and preview-only target membership in base
        run: |
          python3 after/scripts/chrome_preview_evidence.py prepare-base \
            --before-root "$GITHUB_WORKSPACE/before" \
            --after-root "$GITHUB_WORKSPACE/after" \
            --output "$RUNNER_TEMP/chrome-previews/baseline-fixture-supplement.json"

      - name: Capture before from the base checkout
        env:
          PREVIEW_PROJECT_ROOT: ${{ github.workspace }}/before
          PREVIEW_OUTPUT_DIR: ${{ runner.temp }}/chrome-previews/before
        run: |
          set -o pipefail
          bash after/scripts/preview.sh --all 2>&1 | tee "$RUNNER_TEMP/chrome-previews/before.log"

      - name: Capture after from the proposed checkout
        env:
          PREVIEW_OUTPUT_DIR: ${{ runner.temp }}/chrome-previews/after
        run: |
          set -o pipefail
          bash after/scripts/preview.sh --all 2>&1 | tee "$RUNNER_TEMP/chrome-previews/after.log"

      - name: Build contact sheets and exact pixel manifest
        run: |
          python3 after/scripts/chrome_preview_evidence.py compare \
            --before "$RUNNER_TEMP/chrome-previews/before" \
            --after "$RUNNER_TEMP/chrome-previews/after" \
            --before-root "$GITHUB_WORKSPACE/before" \
            --after-root "$GITHUB_WORKSPACE/after" \
            --inventory after/scripts/chrome_token_migration.json \
            --output "$RUNNER_TEMP/chrome-previews"
          cat "$RUNNER_TEMP/chrome-previews/review.md" >> "$GITHUB_STEP_SUMMARY"

      # No pixel-difference gate: macOS/Xcode rendering and live animations are
      # review evidence. A failed real capture remains a failure, never a mock.
      - name: Attach before and after review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chrome-previews-${{ github.event.pull_request.number || github.run_id }}
          path: ${{ runner.temp }}/chrome-previews
          if-no-files-found: error
          retention-days: 30

  chrome-preview-gate:
    name: Chrome preview gate
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: [detect-changes, evidence]
    steps:
      - name: Require captures or an explicit no-capture decision
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          detector = needs["detect-changes"]
          evidence = needs["evidence"]
          required = detector.get("outputs", {}).get("capture_required")
          accepted = detector.get("result") == "success" and (
              (required == "true" and evidence.get("result") == "success")
              or (required == "false" and evidence.get("result") == "skipped")
          )
          if not accepted:
              print(f"Chrome preview gate failed: {json.dumps(needs, sort_keys=True)}")
              sys.exit(1)
          print(f"Chrome preview gate passed (capture_required={required}).")
          PY
