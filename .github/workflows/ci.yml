name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  MIX_ENV: test

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    env:
      # Lint does not exercise the Go renderer; skip its build so this job
      # does not depend on the runner's ambient unpinned Go toolchain.
      MINGA_SKIP_GO_TUI_BUILD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: deps-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ hashFiles('mix.lock') }}
          restore-keys: deps-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-

      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix credo --strict

  test:
    name: Test (Elixir)
    runs-on: ubuntu-latest
    env:
      # The Elixir suite does not exercise the Go renderer binary; the
      # dedicated go-tui jobs build it with a pinned toolchain.
      MINGA_SKIP_GO_TUI_BUILD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: deps-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ hashFiles('mix.lock') }}
          restore-keys: deps-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-

      - run: mix deps.get
      - run: mix deps.compile
      - run: mix protocol.gen
      - name: Check generated Zig protocol exports are committed
        run: git diff --exit-code -- zig/src/protocol.zig
      - name: Check generated protocol artifacts stay out of source
        if: github.event_name == 'pull_request'
        run: scripts/check_protocol_generated_edits "${{ github.event.pull_request.base.sha }}"
      - run: mix protocol.gen --check
      - name: Check cross-language golden manifest is committed
        run: MIX_ENV=test mix protocol.golden --check
      - run: mix native.build.support
      - run: mix test --warnings-as-errors --exclude system_clipboard --exclude conformance

  keystroke-latency-baseline:
    name: Keystroke Latency Baseline
    runs-on: ubuntu-latest
    # Same-runner A/B latency gate. GitHub hosted runners vary run-to-run, so an
    # absolute ceiling calibrated on one machine can never be both tight and
    # stable (PR #2298 saw runner p50 FASTER than the M1 baseline but tails ~30%
    # noisier). So on pull_request runs we bench the PR's merge-base AND the PR
    # HEAD on the SAME runner in the same job, then gate RELATIVELY: head must be
    # within base * (1 + tolerance) per scenario/metric (tolerances in
    # bench/latency_budgets.json: p50 +10%, p99 +20%). Runner speed cancels out.
    #
    # Absolute ceilings remain only as loose catastrophic sanity bounds. If the
    # base bench cannot run (script missing at merge-base, base build fails) we
    # fall back to absolute-sanity-only with a loud warning and do NOT fail the
    # job for infrastructure reasons. On push-to-main there is no PR base, so we
    # record + sanity-check + upload only (trend mode).
    #
    # Flake protection: rerun-once-on-breach re-runs only the HEAD bench and
    # re-compares against the SAME base numbers; the base is never re-benched.
    steps:
      - uses: actions/checkout@v4
        with:
          # Need the merge-base revision available to bench the base side.
          fetch-depth: 0

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: deps-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ hashFiles('mix.lock') }}
          restore-keys: deps-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-

      # Bench the PR's merge-base on this same runner so the relative gate can
      # compare like-for-like. Tolerant by design: any infrastructure failure
      # here (script missing at base, build break) leaves BASE_AVAILABLE=0 and we
      # fall back to absolute-sanity-only. Skipped on push (no PR base).
      - name: Bench merge-base (A/B base side)
        if: github.event_name == 'pull_request'
        id: base_bench
        run: |
          set -u
          HEAD_REF=$(git rev-parse HEAD)
          BASE_SHA=$(git merge-base origin/main HEAD)
          echo "Merge-base: $BASE_SHA"
          echo "BASE_AVAILABLE=0" >> "$GITHUB_ENV"

          if ! git cat-file -e "$BASE_SHA:bench/keystroke_latency_baseline.exs" 2>/dev/null; then
            echo "::warning::bench/keystroke_latency_baseline.exs missing at merge-base $BASE_SHA; relative gate will be skipped (absolute sanity only)."
            exit 0
          fi

          # A relative comparison is only valid when both sides run the same
          # bench. If this PR changes the bench script, base and HEAD would
          # measure different scenarios (the ruler itself changed), so skip the
          # relative gate rather than report the scenario diff as a regression.
          if ! git diff --quiet "$BASE_SHA" HEAD -- bench/keystroke_latency_baseline.exs; then
            echo "::warning::bench/keystroke_latency_baseline.exs changed in this PR; base and HEAD would measure different scenarios, so the relative gate is skipped (absolute sanity only)."
            exit 0
          fi

          # Force checkout: the working tree is CI-disposable and may carry stale
          # generated artifacts; -f avoids "would be overwritten" aborts.
          git checkout -f --quiet "$BASE_SHA"

          if mix deps.get && mix deps.compile && mix protocol.gen && mix native.build.support \
            && MIX_ENV=test mix run bench/keystroke_latency_baseline.exs; then
            cp bench/baselines/keystroke_latency.json /tmp/latency_base.json
            echo "BASE_AVAILABLE=1" >> "$GITHUB_ENV"
            echo "Captured base bench to /tmp/latency_base.json"
          else
            echo "::warning::base bench build/run failed at $BASE_SHA; relative gate will be skipped (absolute sanity only)."
          fi

          # Always return to HEAD so the rest of the job runs against the PR. The
          # base bench rewrites the tracked baseline JSON, so -f is required to
          # switch back cleanly (we already copied what we need to /tmp).
          git checkout -f --quiet "$HEAD_REF"

      # HEAD must be benched LAST so the uploaded artifact reflects the PR HEAD.
      - run: mix deps.get
      - run: mix deps.compile
      - run: mix protocol.gen
      - run: mix native.build.support

      - name: Record keystroke latency baseline (HEAD)
        run: MIX_ENV=test mix run bench/keystroke_latency_baseline.exs | tee keystroke_latency_metrics.txt

      - name: Check keystroke latency budgets
        id: budget_check
        continue-on-error: true
        run: |
          if [ "${BASE_AVAILABLE:-0}" = "1" ]; then
            MIX_ENV=test mix run bench/check_latency_budgets.exs --base /tmp/latency_base.json
          else
            MIX_ENV=test mix run bench/check_latency_budgets.exs
          fi

      # Re-run only the HEAD bench and re-compare against the SAME base numbers.
      - name: Re-run HEAD bench and re-check on breach (flake protection)
        if: steps.budget_check.outcome == 'failure'
        run: |
          echo "First run breached budgets; re-running HEAD bench once before failing."
          MIX_ENV=test mix run bench/keystroke_latency_baseline.exs | tee keystroke_latency_metrics.txt
          if [ "${BASE_AVAILABLE:-0}" = "1" ]; then
            MIX_ENV=test mix run bench/check_latency_budgets.exs --base /tmp/latency_base.json
          else
            MIX_ENV=test mix run bench/check_latency_budgets.exs
          fi

      - name: Upload latency baseline JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keystroke-latency-baseline
          path: |
            bench/baselines/keystroke_latency.json
            keystroke_latency_metrics.txt
          if-no-files-found: error

  conformance:
    name: Neovim Conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install Neovim
        env:
          NEOVIM_VERSION: v0.12.2
        run: |
          curl --fail --location --retry 5 --retry-delay 10 --retry-all-errors --output nvim-linux-x86_64.tar.gz "https://github.com/neovim/neovim/releases/download/${NEOVIM_VERSION}/nvim-linux-x86_64.tar.gz"
          tar xzf nvim-linux-x86_64.tar.gz
          echo "$PWD/nvim-linux-x86_64/bin" >> $GITHUB_PATH

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: deps-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ hashFiles('mix.lock') }}
          restore-keys: deps-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-

      - run: mix deps.get
      - run: nvim --version
      - run: mix native.build.support
      - run: mix conformance

  test-zig:
    name: Test (Zig)
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: zig-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ hashFiles('mix.lock') }}
          restore-keys: zig-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-

      - run: mix deps.get
      - run: mix protocol.gen

      - name: Run Zig tests
        run: cd zig && zig build test

  test-go-tui:
    name: Test (Go TUI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/tui/go.mod
          cache-dependency-path: go/tui/go.sum

      - name: Check Go formatting
        run: |
          cd go/tui
          test -z "$(gofmt -l .)"

      - name: Check Go module files
        run: |
          cd go/tui
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Run Go tests
        run: cd go/tui && go test ./...

  go-tui-boot-smoke:
    name: Go TUI Boot Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/tui/go.mod
          cache-dependency-path: go/tui/go.sum

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: deps-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ hashFiles('mix.lock') }}
          restore-keys: deps-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-

      - run: mix deps.get

      # Build the production Go renderer binary into priv/.
      - run: mix native.build.go_tui

      # Boot the default Go frontend under a real PTY (via MINGA_TTY) and assert
      # it emits a rendered first frame. Headless, no controlling terminal needed.
      - name: Boot Go frontend and verify first frame
        run: python3 scripts/go_tui_boot_smoke.py

  swift:
    name: Swift (macOS GUI)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: swift-deps-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ hashFiles('mix.lock') }}
          restore-keys: swift-deps-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-

      - run: mix deps.get
      - run: mix protocol.gen

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: macos/DerivedData
          key: xcode-${{ runner.os }}-${{ hashFiles('macos/Sources/**/*.swift', 'macos/Sources/**/*.metal', 'macos/project.yml') }}
          restore-keys: xcode-${{ runner.os }}-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: cd macos && xcodegen generate

      - name: Clear stale Swift build cache
        run: rm -rf macos/DerivedData/Build macos/DerivedData/ModuleCache.noindex macos/DerivedData/SDKStatCaches.noindex

      - name: Build
        run: |
          cd macos
          xcodebuild build \
            -scheme Minga \
            -configuration Debug \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Test
        run: |
          cd macos
          xcodebuild test \
            -scheme Minga \
            -configuration Debug \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO

  swift-integration:
    name: Swift Protocol Integration
    runs-on: macos-15
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: integration-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ hashFiles('mix.lock') }}
          restore-keys: integration-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-

      - run: mix deps.get

      # Cache the compiled harness binary so it only rebuilds when its Swift
      # sources (or the protocol generator that feeds the generated Swift) change.
      # The binary lands in _build/test/lib/minga/priv, which the deps cache above
      # also covers, but that key is not source-aware; this source-keyed cache lets
      # the build step skip swiftc on a hit.
      - name: Cache Swift test harness
        id: harness-cache
        uses: actions/cache@v4
        with:
          path: _build/test/lib/minga/priv/minga-test-harness
          key: swift-harness-${{ runner.os }}-${{ hashFiles('macos/Sources/Protocol/**/*.swift', 'macos/Sources/Renderer/WindowContent.swift', 'macos/TestHarness/main.swift', 'mix/protocol_generator.ex') }}

      - name: Build Swift test harness
        if: steps.harness-cache.outputs.cache-hit != 'true'
        run: mix swift.harness

      - name: Run BEAM-to-Swift protocol integration tests
        run: mix test test/minga_editor/integration/gui_protocol_test.exs --include swift_harness

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-latest
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      # Separate cache from test jobs: dialyzer needs _build/dev, not _build/test.
      # The PLT and compiled deps are both under _build/dev.
      - name: Cache deps & PLT
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build/dev
          key: dialyzer-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ hashFiles('mix.lock') }}
          restore-keys: dialyzer-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-

      - run: mix deps.get
      - run: mix dialyzer

  docs:
    name: Deploy Docs
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: pages
      cancel-in-progress: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: deps-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ hashFiles('mix.lock') }}
          restore-keys: deps-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-

      - run: mix deps.get
      - run: MIX_ENV=dev mix docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: doc/
      - id: deployment
        uses: actions/deploy-pages@v4
