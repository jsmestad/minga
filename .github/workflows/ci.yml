name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  MIX_ENV: test

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    env:
      # Lint does not exercise the Go renderer; skip its build so this job
      # does not depend on the runner's ambient unpinned Go toolchain.
      MINGA_SKIP_GO_TUI_BUILD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: deps-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ hashFiles('mix.lock') }}
          restore-keys: deps-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-

      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix credo --strict

  test:
    name: Test (Elixir)
    runs-on: ubuntu-latest
    env:
      # The Elixir suite does not exercise the Go renderer binary; the
      # dedicated go-tui jobs build it with a pinned toolchain.
      MINGA_SKIP_GO_TUI_BUILD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: deps-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ hashFiles('mix.lock') }}
          restore-keys: deps-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-

      - run: mix deps.get
      - run: mix deps.compile
      - run: mix protocol.gen
      - name: Check generated Zig protocol exports are committed
        run: git diff --exit-code -- zig/src/protocol.zig
      - name: Check generated protocol artifacts stay out of source
        if: github.event_name == 'pull_request'
        run: scripts/check_protocol_generated_edits "${{ github.event.pull_request.base.sha }}"
      - run: mix protocol.gen --check
      - name: Check generated production conformance corpus
        run: |
          mix conformance.gen
          git diff --exit-code -- test/conformance/corpus
      - name: Run BEAM production render gates
        run: |
          mix test --include perf test/conformance/production_render_corpus_test.exs \
            test/minga_editor/render_pipeline/resident_incremental_test.exs \
            test/perf/production_gate_test.exs
      - name: Check cross-language golden manifest is committed
        run: MIX_ENV=test mix protocol.golden --check
      - run: mix native.build.support
      - name: Run Elixir tests except the isolated compile-cache suite
        run: mix test --warnings-as-errors --exclude system_clipboard --exclude conformance --exclude extension_compile_cache
      - name: Run extension compile-cache tests in an isolated BEAM
        run: mix test --warnings-as-errors test/minga/extension/compile_cache_test.exs

  keystroke-latency-baseline:
    name: Keystroke Latency Baseline
    runs-on: ubuntu-latest
    # Symmetric same-runner A/B latency gate. The reusable runner alternates
    # base→HEAD and HEAD→base rounds, warms both revisions through the same
    # benchmark path, and compares median round-level metrics. p50 is the strict
    # relative merge gate; p99 is reported as advisory until per-run sampling is
    # large enough to stabilize it. Absolute ceilings remain catastrophic sanity
    # bounds. If base cannot be measured, it records a HEAD sanity-only trend.
    steps:
      - uses: actions/checkout@v4
        with:
          # Need the merge-base revision available to bench the base side.
          fetch-depth: 0

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: deps-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ hashFiles('mix.lock') }}
          restore-keys: deps-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-

      - name: Record and compare keystroke latency rounds
        run: |
          HEAD_REF=$(git rev-parse HEAD)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA=$(git merge-base origin/main "$HEAD_REF")
            echo "Merge-base: $BASE_SHA"
            bash scripts/bench_keystroke_latency_ab "$BASE_SHA" "$HEAD_REF"
          else
            bash scripts/bench_keystroke_latency_ab --head-only "$HEAD_REF"
          fi

      - name: Upload latency baseline JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keystroke-latency-baseline
          path: |
            keystroke_latency.json
            keystroke_latency_comparison.json
            keystroke_latency_metrics.txt
          if-no-files-found: error

  conformance:
    name: Neovim Conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install Neovim
        env:
          NEOVIM_VERSION: v0.12.2
        run: |
          curl --fail --location --retry 5 --retry-delay 10 --retry-all-errors --output nvim-linux-x86_64.tar.gz "https://github.com/neovim/neovim/releases/download/${NEOVIM_VERSION}/nvim-linux-x86_64.tar.gz"
          tar xzf nvim-linux-x86_64.tar.gz
          echo "$PWD/nvim-linux-x86_64/bin" >> $GITHUB_PATH

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: deps-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ hashFiles('mix.lock') }}
          restore-keys: deps-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-

      - run: mix deps.get
      - run: nvim --version
      - run: mix native.build.support
      - run: mix conformance

  test-zig:
    name: Test (Zig)
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: zig-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ hashFiles('mix.lock') }}
          restore-keys: zig-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-

      - run: mix deps.get
      - run: mix language_aliases.gen
      - run: mix protocol.gen

      - name: Run Zig tests
        run: cd zig && zig build test

      - name: Check tree-sitter queries compile against grammars
        run: cd zig && zig build query-check

  test-go-tui:
    name: Test (Go TUI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/tui/go.mod
          cache-dependency-path: go/tui/go.sum

      - name: Check Go formatting
        run: |
          cd go/tui
          test -z "$(gofmt -l .)"

      - name: Check Go module files
        run: |
          cd go/tui
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Run Go tests
        run: cd go/tui && go test ./...

  go-tui-boot-smoke:
    name: Go TUI Boot Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/tui/go.mod
          cache-dependency-path: go/tui/go.sum

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: deps-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ hashFiles('mix.lock') }}
          restore-keys: deps-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-

      - run: mix deps.get

      # Build the production Go renderer binary into priv/.
      - run: mix native.build.go_tui

      # Boot the default Go frontend under a real PTY (via MINGA_TTY) and assert
      # it emits a rendered first frame. Headless, no controlling terminal needed.
      - name: Boot Go frontend and verify first frame
        run: python3 scripts/go_tui_boot_smoke.py

  swift:
    name: Swift (macOS GUI)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          # Need the merge-base revision available for the same-runner render A/B gate.
          fetch-depth: 0

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: swift-deps-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ hashFiles('mix.lock') }}
          restore-keys: swift-deps-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-

      - run: mix deps.get
      - run: mix protocol.gen

      - name: Install pinned XcodeGen
        run: echo "$(scripts/install_xcodegen "$RUNNER_TEMP/xcodegen")" >> "$GITHUB_PATH"

      - name: Gate optimized native render preparation
        run: |
          HEAD_REF=$(git rev-parse HEAD)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA=$(git merge-base origin/main "$HEAD_REF")
            echo "Merge-base: $BASE_SHA"
            bash scripts/bench_render_performance_ab "$BASE_SHA" "$HEAD_REF"
          else
            bash scripts/bench_render_performance_ab --head-only "$HEAD_REF"
          fi

      - name: Gate native Metal completion path
        run: |
          # Hosted macOS GPU scheduling is not a stable baseline environment, and the known-old renderer can trap before producing measurements. CI gates HEAD's absolute budgets; paired A/B evidence is captured separately on stable same-machine hardware.
          HEAD_REF=$(git rev-parse HEAD)
          bash scripts/bench_native_render_performance_ab --head-only "$HEAD_REF"

      - name: Upload native Metal performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-render-performance
          path: |
            native_render_performance.json
            native_render_performance_metrics.txt
            minga-native-render-performance*.ips
          if-no-files-found: error

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: macos/DerivedData
          key: xcode-${{ runner.os }}-${{ hashFiles('macos/Sources/**/*.swift', 'macos/Sources/**/*.metal', 'macos/project.yml') }}
          restore-keys: xcode-${{ runner.os }}-

      - name: Generate Xcode project
        run: cd macos && xcodegen generate

      - name: Clear stale Swift build cache
        run: rm -rf macos/DerivedData/Build macos/DerivedData/ModuleCache.noindex macos/DerivedData/SDKStatCaches.noindex

      - name: Verify Release optimization
        run: scripts/check_macos_release_optimization

      - name: Build
        run: |
          cd macos
          xcodebuild build \
            -scheme Minga \
            -configuration Debug \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Test real packaged IPC helper against BEAM server
        run: |
          set -euo pipefail
          HELPER="$PWD/macos/DerivedData/Build/Products/Debug/Minga.app/Contents/Resources/bin/minga-ipc"
          test -x "$HELPER"
          "$HELPER" nonce | grep -E '^[0-9a-f-]{36}$'
          MINGA_IPC_HELPER="$HELPER" mix test \
            test/macos/native_ipc_helper_integration_test.exs \
            --include macos_ipc_helper

      - name: Test
        run: |
          cd macos
          xcodebuild test \
            -scheme Minga \
            -configuration Debug \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO

  swift-integration:
    name: Swift Protocol Integration
    runs-on: macos-15
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install pinned XcodeGen
        run: echo "$(scripts/install_xcodegen "$RUNNER_TEMP/xcodegen")" >> "$GITHUB_PATH"

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: integration-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ hashFiles('mix.lock') }}
          restore-keys: integration-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-

      - run: mix deps.get

      # Cache the compiled harness binary so it only rebuilds when its Swift
      # sources (or the protocol generator that feeds the generated Swift) change.
      # The binary lands in _build/test/lib/minga/priv, which the deps cache above
      # also covers, but that key is not source-aware; this source-keyed cache lets
      # the build step skip swiftc on a hit.
      - name: Cache Swift test harness
        id: harness-cache
        uses: actions/cache@v4
        with:
          path: _build/test/lib/minga/priv/minga-test-harness
          key: swift-harness-${{ runner.os }}-${{ hashFiles('macos/Sources/Protocol/**/*.swift', 'macos/Sources/Renderer/WindowContent.swift', 'macos/TestHarness/main.swift', 'mix/protocol_generator.ex') }}

      - name: Build Swift test harness
        if: steps.harness-cache.outputs.cache-hit != 'true'
        run: mix swift.harness

      - name: Run BEAM-to-Swift protocol integration tests
        run: mix test test/minga_editor/integration/gui_protocol_test.exs --include swift_harness

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-latest
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      # Separate cache from test jobs: dialyzer needs _build/dev, not _build/test.
      # The PLT and compiled deps are both under _build/dev.
      - name: Cache deps & PLT
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build/dev
          key: dialyzer-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ hashFiles('mix.lock') }}
          restore-keys: dialyzer-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-

      - run: mix deps.get
      - run: mix dialyzer

  docs:
    name: Deploy Docs
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: pages
      cancel-in-progress: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: deps-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ hashFiles('mix.lock') }}
          restore-keys: deps-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-

      - run: mix deps.get
      - run: MIX_ENV=dev mix docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: doc/
      - id: deployment
        uses: actions/deploy-pages@v4
