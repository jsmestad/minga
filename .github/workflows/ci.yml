name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Release publishes a main commit only after its own CI passes, so a main run must finish even when a newer push arrives.
  # Cancelling main runs starved publication during merge bursts (#4123). Pull request runs still cancel on a new push.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MIX_ENV: test

jobs:
  # macOS runners are the scarce pool: GitHub runs only a few macOS jobs at once per account, so every PR that holds them queues the rest. Decide on a Linux runner which macOS-bound jobs this change can affect. Pushes to main run everything; main is the backstop for a gap in these lists.
  changes:
    name: Detect affected jobs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      swift: ${{ steps.classify.outputs.swift }}
      swift_performance: ${{ steps.classify.outputs.swift_performance }}
      release: ${{ steps.classify.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          python3 - <<'PY'
          import fnmatch
          import os
          import subprocess

          # fnmatch's "*" also matches "/", so "dir/**" covers every file below dir.
          ALWAYS = [".github/workflows/ci.yml", ".tool-versions", "mix.exs", "mix.lock"]

          # Swift correctness and protocol integration: native sources plus every BEAM input they build or replay (protocol codegen, GUI encoders, render model, native IPC, renderer recovery, conformance corpus).
          SWIFT = ALWAYS + [
              "macos/**",
              "docs/protocol_schema.toml",
              "generated/**",
              "mix/**",
              "lib/mix/tasks/**",
              "lib/minga/frontend/**",
              "lib/minga/render_model/**",
              "lib/minga_editor/frontend/**",
              "lib/minga_editor/native_ipc/**",
              "lib/minga_editor/render_model/**",
              "lib/minga_editor/renderer/**",
              "test/conformance/**",
              "test/macos/**",
              "test/minga_editor/integration/gui_protocol_test.exs",
              "test/scripts/macos_unit_results_test.py",
              "test/scripts/macos_document_types_test.py",
              "scripts/install_xcodegen",
              "scripts/check_macos_release_optimization",
              "scripts/test_macos_unit",
              "scripts/check_conformance_recovery",
              # The real overlay clone helper runs only on macOS.
              "zig/src/clone_tree_main.zig",
              "lib/minga_agent/changeset/overlay.ex",
              "lib/minga_agent/changeset/overlay/**",
              "test/minga_agent/changeset/overlay_clone_test.exs",
          ]

          # The render benchmarks measure the native render path, so only its inputs select them (#4136): the dispatcher, Metal renderer and shader, protocol decode, fonts, the signposts and scroll-track geometry the renderer calls, the state stores and snapshots the dispatcher commits into (the State+View naming rule), the generated protocol sources, and the benchmark harness, scripts and gate. SwiftUI views, AppKit hosts, app lifecycle, previews and unit tests are compiled into the benchmark tool but never run by it; Swift correctness still builds and tests them on every macOS change.
          SWIFT_PERFORMANCE = ALWAYS + [
              "macos/project.yml",
              "macos/Sources/Instrumentation.swift",
              "macos/Sources/Renderer/**",
              "macos/Sources/Protocol/**",
              "macos/Sources/Font/**",
              "macos/Sources/Views/Editor/EditorScrollTrack.swift",
              "macos/Sources/Views/Shared/**",
              "macos/Sources/Views/*State.swift",
              "macos/Sources/Views/*Snapshot.swift",
              "macos/Tests/NativePerformance/**",
              "macos/Tests/Performance/**",
              "docs/protocol_schema.toml",
              "mix/protocol_generator.ex",
              "mix/tasks/protocol.gen.ex",
              "scripts/install_xcodegen",
              "scripts/bench_render_performance_ab",
              "scripts/check_render_performance",
              "scripts/bench_native_render_performance_ab",
              "scripts/check_native_render_performance",
              "scripts/check_native_render_measurement_result",
          ]

          # Native release producer and consumer boundaries.
          RELEASE = ALWAYS + [
              ".github/workflows/release.yml",
              ".github/workflows/verify-release-candidate.yml",
              ".github/release-targets.json",
              "scripts/stamp-rolling-app",
              "scripts/qualify-homebrew-upgrade",
              "scripts/stage-homebrew-publication.py",
              "scripts/publish-homebrew-release",
              "scripts/publish-homebrew-tap",
              "test/scripts/*homebrew*test.py",
              "scripts/build-release-erts.py",
              "scripts/release_erts_sources.json",
              "scripts/check-release-contents",
              "scripts/release_candidate.py",
              "scripts/fetch-run-artifact",
              "test/scripts/fetch_run_artifact_test.py",
              "mix/release_erts.ex",
              "mix/tasks/release.tui.ex",
              "rel/**",
              "macos/Resources/bin/minga-tui",
              "test/scripts/release_erts_producer_test.py",
              "test/scripts/release_contents_test.py",
              "test/scripts/release_candidate_test.py",
              "scripts/render-tui-formula",
              "test/scripts/render_tui_formula_test.py",
              "scripts/build-tui-packages",
              "test/scripts/build_tui_packages_test.py",
              "scripts/render-aur-pkgbuild",
              "packaging/linux/**",
              "test/scripts/render_aur_pkgbuild_test.py",
              "scripts/smoke-linux-packages",
              "scripts/linux-packaging-toolchain",
              "scripts/build-package-repos",
              "scripts/test-package-repos",
              "scripts/upload-package-repos",
              "test/scripts/upload_package_repos_test.py",
              "test/scripts/package_repo_fixtures.py",
              "test/scripts/package_repos_e2e.sh",
          ]

          def changed_paths(revision_range):
              output = subprocess.check_output(["git", "diff", "--name-only", "--no-renames", "-z", revision_range])
              paths = [path for path in output.decode().split("\0") if path]
              print(f"{len(paths)} changed paths in {revision_range}")
              return paths

          def affected(paths, patterns):
              return any(fnmatch.fnmatchcase(path, pattern) for path in paths for pattern in patterns)

          def commit_exists(sha):
              return bool(sha) and subprocess.run(["git", "cat-file", "-e", f"{sha}^{{commit}}"], capture_output=True).returncode == 0

          if os.environ["EVENT_NAME"] == "pull_request":
              changed = changed_paths(f'{os.environ["BASE_SHA"]}...{os.environ["HEAD_SHA"]}')
              decisions = {
                  "swift": affected(changed, SWIFT),
                  "swift_performance": affected(changed, SWIFT_PERFORMANCE),
                  "release": affected(changed, RELEASE),
              }
          else:
              # Main runs every Swift job. Release prerequisites keep their pushed-range check; an unknown range runs them.
              before = os.environ["BEFORE_SHA"]
              release = not commit_exists(before) or affected(changed_paths(f"{before}..HEAD"), RELEASE)
              decisions = {"swift": True, "swift_performance": True, "release": release}

          with open(os.environ["GITHUB_OUTPUT"], "a") as github_output:
              for name, required in decisions.items():
                  value = "true" if required else "false"
                  github_output.write(f"{name}={value}\n")
                  print(f"{name}: {value}")
          PY

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    env:
      # Lint does not exercise the Go renderer; skip its build so this job
      # does not depend on the runner's ambient unpinned Go toolchain.
      MINGA_SKIP_GO_TUI_BUILD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: deps-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ hashFiles('mix.lock') }}
          restore-keys: deps-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-

      - name: Check real-session evidence integrity
        run: python3 -m unittest discover -s test/scripts -p collect_rejection_sessions_test.py

      - name: Check development profile isolation
        run: python3 -m unittest discover -s test/scripts -p dev_profile_test.py

      - name: Check storyboard flow invariants
        run: python3 design/tools/storyboard/check.py

      # site_check.py reads lib/, macos/Sources, go/tui and this workflow (see design/tools/site_claims.toml). site.yml's path filter misses most of those, so the check runs here on every change.
      - name: Check site copy against the keymap and design docs
        run: python3 design/tools/site_check.py

      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix credo --strict
      - run: mix ex_dna --max-clones 0
      - run: mix reach.check --arch

  test:
    name: Test (Elixir)
    runs-on: ubuntu-latest
    env:
      # The Elixir suite does not exercise the Go renderer binary; the
      # dedicated go-tui jobs build it with a pinned toolchain.
      MINGA_SKIP_GO_TUI_BUILD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: deps-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ hashFiles('mix.lock') }}
          restore-keys: deps-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-

      - run: mix deps.get
      - run: mix deps.compile
      - name: Reject stale or uncommitted generated sources
        run: |
          mix codegen
          changes=$(git status --porcelain --untracked-files=all -- generated/elixir go/tui/internal/generated zig/src/protocol.zig macos/Sources/Protocol/DesignTokens.generated.swift)
          if [ -n "$changes" ]; then
            printf 'Run mix codegen and commit the generated source changes:\n%s\n' "$changes"
            exit 1
          fi
      - name: Check generated protocol artifacts stay out of source
        if: github.event_name == 'pull_request'
        run: scripts/check_protocol_generated_edits "${{ github.event.pull_request.base.sha }}"
      - name: Check generated production conformance corpus
        run: |
          mix conformance.gen
          git diff --exit-code -- test/conformance/corpus
      - name: Run BEAM production render gates
        run: |
          mix test --include perf test/conformance/production_render_corpus_test.exs \
            test/minga_editor/render_pipeline/resident_incremental_test.exs \
            test/perf/production_gate_test.exs
      - name: Check cross-language golden manifest is committed
        run: MIX_ENV="test" mix protocol.golden --check
      - run: mix native.build.support
      - name: Run Elixir tests except the isolated compile-cache suite and the storyboard
        run: mix test --warnings-as-errors --max-cases 4 --timeout 120000 --exclude system_clipboard --exclude conformance --exclude extension_compile_cache --exclude storyboard
      - name: Run extension compile-cache tests in an isolated BEAM
        run: mix test --warnings-as-errors test/minga/extension/compile_cache_test.exs

  storyboard:
    # The storyboard factory (#4035): every designed scenario is reachable,
    # checkable and escapable in the real editor. Runs on its own so it is a
    # separately required check; the main Elixir job excludes the tag.
    # It also records every built scenario's packets and draws the TUI frames with the Go renderer (#4036);
    # the storyboard-macos job draws the same packets on macOS and storyboard-renders judges both.
    name: Storyboard (Elixir)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MINGA_SKIP_GO_TUI_BUILD: "1"
    outputs:
      macos_required: ${{ steps.tui-diff.outputs.macos_required }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The render diff compares with the baselines on the base revision.
          fetch-depth: 0

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: deps-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ hashFiles('mix.lock') }}
          restore-keys: deps-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-

      - run: mix deps.get
      - run: mix deps.compile
      - run: mix native.build.support
      - name: Run the storyboard suite
        run: mix test --warnings-as-errors --only storyboard test/storyboard

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/tui/go.mod
          cache-dependency-path: go/tui/go.sum

      - name: Record transcripts and draw the TUI frames
        run: python3 design/tools/storyboard/renders.py render --out "$RUNNER_TEMP/storyboard"

      # Never fails: storyboard-renders judges the diff once the macOS frames exist. This decides whether macOS must draw:
      # a macOS transcript differs from the one its baseline was promoted from, or a macOS-only input changed.
      - name: Diff the TUI frames against the baselines
        id: tui-diff
        run: |
          python3 design/tools/storyboard/renders.py diff --out "$RUNNER_TEMP/storyboard" --frontends tui \
            --base "${{ github.event.pull_request.base.sha || github.event.before }}" --github-output "$GITHUB_OUTPUT"

      - name: Upload transcripts and TUI frames
        uses: actions/upload-artifact@v4
        with:
          name: storyboard-tui
          path: ${{ runner.temp }}/storyboard
          if-no-files-found: error
          retention-days: 14

  storyboard-macos:
    # Draws every macOS transcript through the production decoder, ContentView and Metal editor in PreviewHost (#4036).
    # It runs when a change can move a macOS frame: native sources, or different packets for a macOS frame.
    name: Storyboard renders (macOS)
    needs: [changes, storyboard]
    if: ${{ !cancelled() && needs.storyboard.result == 'success' && (github.event_name == 'push' || needs.changes.outputs.swift == 'true' || needs.storyboard.outputs.macos_required == 'true') }}
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      MINGA_REQUIRE_METAL: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Restore Swift deps
        uses: actions/cache/restore@v4
        with:
          path: |
            deps
            _build
          key: swift-deps-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ hashFiles('mix.lock') }}
          restore-keys: swift-deps-${{ runner.os }}-

      - run: mix deps.get

      - name: Install pinned XcodeGen
        run: scripts/install_xcodegen "$RUNNER_TEMP/xcodegen" >> "$GITHUB_PATH"

      - name: Download transcripts
        uses: actions/download-artifact@v4
        with:
          name: storyboard-tui
          path: ${{ runner.temp }}/storyboard

      - name: Draw the macOS frames
        env:
          STORYBOARD_DERIVED_DATA: ${{ runner.temp }}/storyboard-derived
        run: python3 design/tools/storyboard/renders.py render-macos --out "$RUNNER_TEMP/storyboard"

      - name: Upload macOS frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storyboard-macos
          path: |
            ${{ runner.temp }}/storyboard/renders/**/macos-*
          if-no-files-found: error
          retention-days: 14

  storyboard-renders:
    # The hard render gate (#4036): every frame matches its committed baseline, every built scenario has one, and a
    # scenario that changed against the base revision changed on both frontends or carries a platform-specific reason.
    # It also publishes the storyboard page. Visual review never blocks here; see docs/design/visual_rubric.md.
    name: Storyboard renders
    needs: [changes, storyboard, storyboard-macos]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test the render gate, the layout audit and the visual review records
        run: |
          python3 -m unittest discover -s test/scripts -p 'storyboard_renders_test.py'
          python3 -m unittest discover -s test/scripts -p 'storyboard_audit_test.py'
          python3 -m unittest discover -s test/scripts -p 'storyboard_review_test.py'

      - name: Require the renders this change needs
        env:
          RENDER: ${{ needs.storyboard.result }}
          MACOS: ${{ needs.storyboard-macos.result }}
          MACOS_REQUIRED: ${{ github.event_name == 'push' || needs.changes.outputs.swift == 'true' || needs.storyboard.outputs.macos_required == 'true' }}
        run: |
          printf 'TUI renders: %s; macOS renders: %s (required: %s)\n' "$RENDER" "$MACOS" "$MACOS_REQUIRED"
          [[ "$RENDER" == success ]] || exit 1
          [[ "$MACOS" == success || ( "$MACOS_REQUIRED" == false && "$MACOS" == skipped ) ]] || exit 1
          # A skipped macOS job means none of its inputs changed, so its frames equal their baselines.
          if [[ "$MACOS" == success ]]; then
            echo "FRONTENDS=tui,macos" >> "$GITHUB_ENV"; echo "UNCHANGED=" >> "$GITHUB_ENV"
          else
            echo "FRONTENDS=tui" >> "$GITHUB_ENV"; echo "UNCHANGED=macos" >> "$GITHUB_ENV"
          fi

      - name: Download transcripts and TUI frames
        uses: actions/download-artifact@v4
        with:
          name: storyboard-tui
          path: ${{ runner.temp }}/storyboard

      - name: Download macOS frames
        if: needs.storyboard-macos.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: storyboard-macos
          path: ${{ runner.temp }}/storyboard/renders

      - name: Diff every frame against its baseline and check parity
        id: diff
        run: |
          set +e
          python3 design/tools/storyboard/renders.py diff --out "$RUNNER_TEMP/storyboard" --frontends "$FRONTENDS" --check \
            --assume-unchanged "$UNCHANGED" \
            --base "${{ github.event.pull_request.base.sha || github.event.before }}"
          status=$?
          cat "$RUNNER_TEMP/storyboard/diff.md" >> "$GITHUB_STEP_SUMMARY"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      # The layout audit (#4036, AC 5) measures every rendered frame against docs/design/anatomy.md.
      - name: Audit the layout of every rendered scenario
        id: audit
        run: |
          set +e
          python3 design/tools/storyboard/audit.py --out "$RUNNER_TEMP/storyboard" --frontends "$FRONTENDS" --check
          status=$?
          cat "$RUNNER_TEMP/storyboard/audit.md" >> "$GITHUB_STEP_SUMMARY"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Build the storyboard page
        run: python3 design/tools/storyboard/renders.py page --out "$RUNNER_TEMP/storyboard"

      - name: Publish the storyboard page
        uses: actions/upload-artifact@v4
        with:
          name: storyboard-page
          path: |
            ${{ runner.temp }}/storyboard/page
            ${{ runner.temp }}/storyboard/diff.json
            ${{ runner.temp }}/storyboard/diff.md
            ${{ runner.temp }}/storyboard/audit.json
            ${{ runner.temp }}/storyboard/audit.md
          if-no-files-found: error
          retention-days: 30

      - name: Fail on a stale render, a missing baseline, a parity violation or a layout violation
        if: steps.diff.outputs.status != '0' || steps.audit.outputs.status != '0'
        run: |
          echo "See the job summary. Accept intended changes with design/tools/storyboard/renders.py promote (docs/design/storyboard.md)."
          echo "Fix layout violations, or list them in test/storyboard/audit_exceptions.toml with a reason and an issue."
          exit 1

  test-sdk:
    name: Test (Extension SDK)
    runs-on: ubuntu-latest
    steps:
      # Keep the workspace root free of mix.exs while setup-beam installs Hex.
      - uses: actions/checkout@v4
        with:
          path: sdk-checkout
          sparse-checkout: sdk

      - uses: erlef/setup-beam@v1
        with:
          version-file: sdk-checkout/.tool-versions
          version-type: strict

      - name: Compile and test the standalone SDK
        working-directory: sdk-checkout/sdk
        run: |
          mix deps.get
          mix compile --warnings-as-errors
          mix test --warnings-as-errors

      - name: Build SDK docs without warnings
        working-directory: sdk-checkout/sdk
        env:
          MIX_ENV: dev
        run: mix docs --warnings-as-errors

      - name: Build the SDK Hex package
        working-directory: sdk-checkout/sdk
        run: mix hex.build

  test-git-extended:
    name: Test (GitExtended extension)
    runs-on: ubuntu-latest
    # Run the standalone extension's integration suite against the candidate host.
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - uses: actions/checkout@v4
        with:
          repository: jsmestad/minga-git-extended
          ref: 5abf5009f6018b88b7cb301d1e29f2c7836b04bc
          path: git-extended-checkout
          persist-credentials: false

      - name: Test the standalone GitExtended suite
        working-directory: git-extended-checkout
        env:
          MIX_ENV: test
          MINGA_HOST_SOURCE: ${{ github.workspace }}
        run: |
          mix deps.get
          mix test

  keystroke-latency-baseline:
    name: Keystroke Latency Baseline
    runs-on: ubuntu-latest
    # Symmetric same-runner A/B latency gate. The reusable runner alternates
    # base→HEAD and HEAD→base rounds, warms both revisions through the same
    # benchmark path, and compares median round-level metrics. p50 is the strict
    # relative merge gate; p99 is reported as advisory until per-run sampling is
    # large enough to stabilize it. Absolute ceilings remain catastrophic sanity
    # bounds. If base cannot be measured, it records a HEAD sanity-only trend.
    steps:
      - uses: actions/checkout@v4
        with:
          # Need the merge-base revision available to bench the base side.
          fetch-depth: 0

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      # Each revision owns its compiled dependencies and app. Only share Hex package downloads.
      - name: Cache Hex package downloads
        uses: actions/cache@v4
        with:
          path: ~/.hex/packages
          key: keystroke-hex-${{ hashFiles('mix.lock') }}
          restore-keys: keystroke-hex-

      - name: Test keystroke benchmark orchestration
        run: python3 -m unittest discover -s test/scripts -p keystroke_latency_runner_test.py

      - name: Record and compare keystroke latency rounds
        run: |
          HEAD_REF=$(git rev-parse HEAD)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA=$(git merge-base origin/main "$HEAD_REF")
            echo "Merge-base: $BASE_SHA"
            bash scripts/bench_keystroke_latency_ab "$BASE_SHA" "$HEAD_REF"
          else
            bash scripts/bench_keystroke_latency_ab --head-only "$HEAD_REF"
          fi

      - name: Upload latency baseline JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keystroke-latency-baseline
          path: |
            keystroke_latency.json
            keystroke_latency_comparison.json
            keystroke_latency_metrics.txt
          if-no-files-found: error

  conformance:
    name: Neovim Conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install Neovim
        env:
          NEOVIM_VERSION: v0.12.2
        run: |
          curl --fail --location --retry 5 --retry-delay 10 --retry-all-errors --output nvim-linux-x86_64.tar.gz "https://github.com/neovim/neovim/releases/download/${NEOVIM_VERSION}/nvim-linux-x86_64.tar.gz"
          tar xzf nvim-linux-x86_64.tar.gz
          echo "$PWD/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: deps-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ hashFiles('mix.lock') }}
          restore-keys: deps-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-

      - run: mix deps.get
      - run: nvim --version
      - run: mix native.build.support
      - run: mix conformance

  test-zig:
    name: Test (Zig)
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: zig-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ hashFiles('mix.lock') }}
          restore-keys: zig-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-

      - run: mix deps.get
      - run: mix language_aliases.gen
      - run: mix protocol.gen

      - name: Run Zig tests
        run: cd zig && zig build test

      - name: Check tree-sitter queries compile against grammars
        run: cd zig && zig build query-check

  test-go-tui:
    name: Test (Go TUI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/tui/go.mod
          cache-dependency-path: go/tui/go.sum

      - name: Check Go formatting
        run: |
          cd go/tui
          test -z "$(gofmt -l .)"

      - name: Check Go module files
        run: |
          cd go/tui
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Run Go tests
        run: cd go/tui && go test ./...

  go-tui-boot-smoke:
    name: Go TUI Boot Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/tui/go.mod
          cache-dependency-path: go/tui/go.sum

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: deps-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ hashFiles('mix.lock') }}
          restore-keys: deps-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-

      - run: mix deps.get

      # Build the production Go renderer binary into priv/.
      - run: mix native.build.go_tui

      # Boot the default Go frontend under a real PTY (via MINGA_TTY) and assert its ready protocol packet.
      # This proves startup and sizing, not rendered output; scripts/go_tui_capture.py supplies terminal-output evidence.
      - name: Boot Go frontend and verify ready protocol packet
        run: python3 scripts/go_tui_boot_smoke.py

  swift-tests:
    name: Swift (macOS correctness)
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-15
    permissions:
      contents: read
    env:
      # ViewInspector's glass-effect inspectors require the macOS 26 SDK.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      # Pixel conformance must fail, not silently skip, without a real GPU.
      MINGA_REQUIRE_METAL: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: swift-deps-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ hashFiles('mix.lock') }}
          restore-keys: swift-deps-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-

      - run: mix deps.get
      - run: mix protocol.gen
      - run: mix conformance.gen

      - name: Install pinned XcodeGen
        run: scripts/install_xcodegen "$RUNNER_TEMP/xcodegen" >> "$GITHUB_PATH"

      - name: Configure Xcode compiler cache
        id: compiler-cache
        run: |
          xcodebuild -version
          xcode_build=$(xcodebuild -version | awk '/^Build version / {print $3}')
          test -n "$xcode_build"
          echo "xcode-build=$xcode_build" >> "$GITHUB_OUTPUT"
          cat > "$RUNNER_TEMP/compiler-cache.xcconfig" <<EOF
          COMPILATION_CACHE_ENABLE_CACHING = YES
          COMPILATION_CACHE_ENABLE_DIAGNOSTIC_REMARKS = YES
          COMPILATION_CACHE_CAS_PATH = $RUNNER_TEMP/xcode-compiler-cas
          COMPILATION_CACHE_KEEP_CAS_DIRECTORY = YES
          COMPILATION_CACHE_LIMIT_SIZE = 1G
          EOF
          echo "XCODE_XCCONFIG_FILE=$RUNNER_TEMP/compiler-cache.xcconfig" >> "$GITHUB_ENV"

      # Restore compiler results only. Xcode builds and links fresh apps, bundles, and test plans on every runner.
      - name: Cache Xcode compiler results
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/xcode-compiler-cas
          key: xcode-cas-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler-cache.outputs.xcode-build }}-${{ hashFiles('macos/**', 'docs/protocol_schema.toml') }}
          restore-keys: xcode-cas-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.compiler-cache.outputs.xcode-build }}-

      - name: Generate Xcode project
        run: cd macos && xcodegen generate

      - name: Verify Release optimization
        run: scripts/check_macos_release_optimization

      - name: Build
        run: |
          cd macos
          xcodebuild build \
            -scheme Minga \
            -configuration Debug \
            -derivedDataPath DerivedData \
            -showBuildTimingSummary \
            CODE_SIGNING_ALLOWED=NO

      - name: Test real packaged IPC helper against BEAM server
        run: |
          set -euo pipefail
          HELPER="$PWD/macos/DerivedData/Build/Products/Debug/Minga.app/Contents/Resources/bin/minga-ipc"
          test -x "$HELPER"
          "$HELPER" nonce | grep -E '^[0-9a-f-]{36}$'
          MINGA_IPC_HELPER="$HELPER" mix test \
            test/macos/native_ipc_helper_integration_test.exs \
            --include macos_ipc_helper

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # Builds only the clone helper, the way `mix compile.minga_zig` does, instead of the whole native support set.
      - name: Test real overlay clone helper against APFS
        run: |
          set -euo pipefail
          (cd zig && zig build-exe src/clone_tree_main.zig -lc -femit-bin=../priv/minga-clone-tree)
          codesign --force --sign - --identifier minga-clone-tree priv/minga-clone-tree
          mix test test/minga_agent/changeset/overlay_clone_test.exs --include overlay_clone

      - name: Test native result classification and document types
        run: |
          python3 -m unittest discover -s test/scripts -p macos_unit_results_test.py
          python3 -m unittest discover -s test/scripts -p macos_document_types_test.py

      # Timing, inverse mutations, and a second warm run live in swift-evidence.yml.
      # The canonical unit runner still executes all Metal and production-view regressions here.
      - name: Test native units and Metal conformance
        run: scripts/test_macos_unit --output-dir macos-unit-evidence

      - name: Upload native unit test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-unit-evidence
          path: macos-unit-evidence/
          if-no-files-found: error

      - name: Prove recovery generation policy reaches native commits
        run: scripts/check_conformance_recovery

      - name: Upload recovery generation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-recovery-evidence
          path: conformance-recovery-evidence/
          if-no-files-found: warn

  swift-performance:
    name: Swift (macOS performance)
    needs: changes
    if: needs.changes.outputs.swift_performance == 'true'
    runs-on: macos-15
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      MINGA_REQUIRE_METAL: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          # The base and HEAD render benchmarks run on this same runner.
          fetch-depth: 0

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Restore Swift deps
        uses: actions/cache/restore@v4
        with:
          path: |
            deps
            _build
          key: swift-deps-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ hashFiles('mix.lock') }}
          restore-keys: swift-deps-${{ runner.os }}-

      - run: mix deps.get

      - name: Install pinned XcodeGen
        run: scripts/install_xcodegen "$RUNNER_TEMP/xcodegen" >> "$GITHUB_PATH"

      # The benchmark scripts generate protocol sources for each measured revision.

      - name: Gate optimized native render preparation
        run: |
          HEAD_REF=$(git rev-parse HEAD)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA=$(git merge-base origin/main "$HEAD_REF")
            echo "Merge-base: $BASE_SHA"
            bash scripts/bench_render_performance_ab "$BASE_SHA" "$HEAD_REF"
          else
            bash scripts/bench_render_performance_ab --head-only "$HEAD_REF"
          fi

      # Hosted macOS runs this on a paravirtual GPU that other tenants preempt, and the known-old renderer can trap before producing measurements. CI therefore measures HEAD only against the absolute budgets; paired A/B evidence is captured separately on stable same-machine hardware.
      #
      # Decision (#4136): two rules keep runner timing noise from failing a pull request. First, the detector's SWIFT_PERFORMANCE list runs this job only when a change can reach the measured render path. Second, when the job does run (a render-path change, or an always-run input such as this workflow), the two wall-clock p95 budgets, gpu_active_time and handoff_to_copy_completion, pass when at least one whole run meets both. Host scheduling only adds time, so one run inside the unchanged 8.33 ms budget shows that the path fits a 120 Hz frame, and a path that is too slow breaches in every run. CPU-time budgets keep the median of the runs. Resource, transcript-accounting and capacity counters fail on any run. When all three runs breach a wall-clock budget and nothing else fails, four confirmation runs follow (about 8 s each) and the gate fails only when all seven breach. Any other failure is final after three runs. A run that crashes or writes no measurement fails at once.
      #
      # Recorded hosted variance: 125 jobs, 375 runs, 2026-11-23 to 2026-11-24 (98 pull request, 27 main; macos-15, Apple Paravirtual device), all on ordinary development changes. handoff_to_copy_completion p95 per run: median 4.09 ms, 90th percentile 7.90 ms, maximum 18.94 ms; 26 runs (6.9%) exceeded 8.33 ms. Spread between the fastest and slowest run of one job: median 2.64 ms, 95th percentile 7.53 ms, maximum 13.30 ms. The previous median-of-three verdict failed 4 of the 125 jobs (3.2%): three documentation-only pull requests and #4127. The quietest run of a job: median 3.21 ms, maximum 6.85 ms, so this verdict passes all 125 with at least 1.48 ms of headroom. gpu_active_time p95 behaves the same way: 13 runs exceeded the budget, and the lowest value in a job never exceeded 5.59 ms.
      #
      # What the verdict still catches: with a uniform slowdown added to every recorded run, all three runs of a job breach in 106 of the 125 jobs at +6 ms, and at +7 ms every one of the 375 runs breaches (the fastest recorded run is 1.46 ms), so any seven fail. Confirmation runs can clear a three-run breach only when a later run is inside the budget. NativeRenderPerformanceGateTests covers the rule. What it gives up: a tail regression that stays inside the budget in at least one run. The stable-hardware paired comparison owns that case.
      - name: Gate native Metal completion path
        run: |
          HEAD_REF=$(git rev-parse HEAD)
          bash scripts/bench_native_render_performance_ab --head-only "$HEAD_REF"

      - name: Upload native Metal performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-render-performance
          path: |
            native_render_performance.json
            native_render_performance_metrics.txt
            minga-native-render-performance*.ips
          if-no-files-found: error

  swift:
    # Preserve the required check name and require both macOS jobs to pass, or to be skipped because the change cannot affect them.
    name: Swift (macOS GUI)
    # !cancelled(), not always(): a run cancelled by a newer push must finish at once. always() queued this job for a runner after cancellation, and the newer run waited for it.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions: {}
    needs: [changes, swift-tests, swift-performance]
    steps:
      - name: Require Swift correctness and performance
        env:
          DETECTOR: ${{ needs.changes.result }}
          CORRECTNESS: ${{ needs.swift-tests.result }}
          CORRECTNESS_REQUIRED: ${{ needs.changes.outputs.swift }}
          PERFORMANCE: ${{ needs.swift-performance.result }}
          PERFORMANCE_REQUIRED: ${{ needs.changes.outputs.swift_performance }}
        run: |
          printf 'Detector: %s; Swift correctness: %s (required: %s); Swift performance: %s (required: %s)\n' \
            "$DETECTOR" "$CORRECTNESS" "$CORRECTNESS_REQUIRED" "$PERFORMANCE" "$PERFORMANCE_REQUIRED"
          accepted() { [[ "$1" == success || ( "$2" == false && "$1" == skipped ) ]]; }
          [[ "$DETECTOR" == success ]] && accepted "$CORRECTNESS" "$CORRECTNESS_REQUIRED" && accepted "$PERFORMANCE" "$PERFORMANCE_REQUIRED"

  swift-integration:
    name: Swift Protocol Integration
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-15
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install pinned XcodeGen
        run: scripts/install_xcodegen "$RUNNER_TEMP/xcodegen" >> "$GITHUB_PATH"

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: integration-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ hashFiles('mix.lock') }}
          restore-keys: integration-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-

      - run: mix deps.get

      # Cache the compiled harness binary so it only rebuilds when its Swift
      # sources (or the protocol generator that feeds the generated Swift) change.
      # The binary lands in _build/test/lib/minga/priv, which the deps cache above
      # also covers, but that key is not source-aware; this source-keyed cache lets
      # the build step skip swiftc on a hit.
      - name: Cache Swift test harness
        id: harness-cache
        uses: actions/cache@v4
        with:
          path: _build/test/lib/minga/priv/minga-test-harness
          key: swift-harness-${{ runner.os }}-${{ hashFiles('macos/Sources/Protocol/**/*.swift', 'macos/Sources/MainRunLoopAction.swift', 'macos/Sources/Renderer/WindowContent.swift', 'macos/TestHarness/main.swift', 'lib/mix/tasks/swift_harness.ex', 'mix/protocol_generator.ex') }}

      - name: Build Swift test harness
        if: steps.harness-cache.outputs.cache-hit != 'true'
        run: mix swift.harness

      - name: Run BEAM-to-Swift protocol integration tests
        run: mix test test/minga_editor/integration/gui_protocol_test.exs --include swift_harness

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-latest
    # A warm run takes about 5 to 8 minutes; a cold PLT build adds the OTP, Elixir, and dependency PLTs. The bound turns a hang into an explicit timeout.
    timeout-minutes: 40
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      # Separate cache from test jobs: dialyzer needs _build/dev, not _build/test.
      # mix.exs also sets the PLT app list; an exact cache hit cannot save a repaired PLT.
      - name: Cache deps & PLT
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build/dev
          key: dialyzer-v2-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ hashFiles('mix.exs', 'mix.lock') }}
          restore-keys: dialyzer-v2-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-

      # Dialyzer's analysis peaks near the 16 GB runner limit (#3869). Larger GitHub runners need an organization on a paid plan, so add swap: a peak past RAM pages instead of losing the runner.
      - name: Add swap
        run: |
          sudo fallocate -l 16G /mnt/dialyzer.swap
          sudo chmod 600 /mnt/dialyzer.swap
          sudo mkswap /mnt/dialyzer.swap
          sudo swapon /mnt/dialyzer.swap

      - name: Report runner resources
        run: |
          nproc
          free -m
          swapon --show || true
          df -h . "$HOME"

      - run: mix deps.get

      # Compile, PLT build, and analysis run as separate steps so a lost runner shows which phase it was in, and completed phases keep their logs. The memory guard fails a step with an explicit error before memory exhaustion starves the runner.
      - name: Compile
        timeout-minutes: 10
        run: .github/scripts/run-with-memory-guard.sh mix compile

      - name: Build or update PLT
        timeout-minutes: 25
        run: .github/scripts/run-with-memory-guard.sh mix dialyzer --plt
        env:
          # Dialyzer sizes its worker pool from the online BEAM schedulers.
          ERL_FLAGS: "+S 2:2"

      - name: Run Dialyzer
        timeout-minutes: 15
        run: .github/scripts/run-with-memory-guard.sh mix dialyzer
        env:
          ERL_FLAGS: "+S 2:2"
          # Analysis peaks near the 16 GB of RAM (#3869); the added swap absorbs the excess and the guard counts RAM plus free swap.
          MEMORY_GUARD_MIN_AVAILABLE_MB: "768"

  release-prerequisites:
    name: Native release prerequisites (${{ matrix.runner }})
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: ${{ matrix.runner }}
    # The Linux x86_64 runner also builds package repositories and installs from them in four containers.
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned release Python
        id: inputs
        run: |
          set -euo pipefail
          python_version=$(jq -er '.build_python_version | select(type == "string")' scripts/release_erts_sources.json)
          [[ "$python_version" =~ ^3\.[0-9]+\.[0-9]+$ ]]
          printf 'python_version=%s\n' "$python_version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.inputs.outputs.python_version }}
      - name: Install and verify native Ubuntu build prerequisites
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = 24.04
          test "$(getconf GNU_LIBC_VERSION)" = 'glibc 2.39'
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential binutils perl ca-certificates
      - name: Verify pinned Python and release producer/consumer boundaries
        env:
          PYTHON_VERSION: ${{ steps.inputs.outputs.python_version }}
        run: |
          set -euo pipefail
          python3 -c 'import os, platform, tarfile; assert platform.python_version() == os.environ["PYTHON_VERSION"]; assert callable(tarfile.data_filter)'
          python3 test/scripts/release_erts_producer_test.py
          python3 test/scripts/release_contents_test.py
          python3 test/scripts/release_candidate_test.py
          python3 -B test/scripts/fetch_run_artifact_test.py
          python3 -B test/scripts/render_tui_formula_test.py
          python3 -B test/scripts/render_aur_pkgbuild_test.py
          python3 -B test/scripts/upload_package_repos_test.py
          bash -n scripts/qualify-homebrew-upgrade
          bash -n scripts/fetch-run-artifact
          bash -n scripts/smoke-linux-packages
          bash -n scripts/linux-packaging-toolchain
          bash -n scripts/build-package-repos scripts/test-package-repos test/scripts/package_repos_e2e.sh
      - name: Verify Debian and RPM package assembly
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends rpm rpm2cpio cpio desktop-file-utils
          python3 -B test/scripts/build_tui_packages_test.py
      - name: Build signed package repositories and install from them
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: test/scripts/package_repos_e2e.sh
      - name: Verify Homebrew promotion without publication credentials
        if: runner.os == 'Linux'
        run: python3 -B -m unittest discover -s test/scripts -p '*homebrew*test.py'

  ci-gate:
    name: CI gate
    # !cancelled(), not always(): a run cancelled by a newer push must finish at once. always() queued this job for a runner after cancellation, and the newer run waited for it.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions: {}
    # Swift's required check aggregates both macOS jobs; docs deploys only on main.
    needs:
      - changes
      - lint
      - test
      - storyboard
      - storyboard-renders
      - test-sdk
      - test-git-extended
      - keystroke-latency-baseline
      - conformance
      - test-zig
      - test-go-tui
      - go-tui-boot-smoke
      - swift
      - swift-integration
      - dialyzer
      - release-prerequisites
    steps:
      - name: Require every substantive job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          # A job may be skipped only when the detector ran and decided the change cannot affect it.
          detected = needs.get("changes", {}).get("outputs", {})
          skippable = {
              "swift-integration": detected.get("swift") == "false",
              "release-prerequisites": detected.get("release") == "false",
          }
          failed = {
              job: details.get("result")
              for job, details in needs.items()
              if details.get("result") != "success"
              and not (details.get("result") == "skipped" and skippable.get(job, False))
          }
          if not needs or failed:
              print(f"CI gate failed: {json.dumps(failed, sort_keys=True)}")
              sys.exit(1)
          print("Every substantive CI job succeeded.")
          PY

  # Build and deploy run as separate jobs, as in GitHub's Pages starter workflow. Deploying in the job
  # that uploaded the artifact fails intermittently: the artifact lookup can miss an upload made a second earlier.
  docs:
    name: Build Docs
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: deps-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ hashFiles('mix.lock') }}
          restore-keys: deps-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-

      - run: mix deps.get
      - run: MIX_ENV=dev mix docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: doc/

  docs-deploy:
    name: Deploy Docs
    needs: docs
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: pages
      cancel-in-progress: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
