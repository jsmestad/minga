# Layout-audit findings that a later ticket fixes (#4036, AC 5). See docs/design/anatomy.md, "The layout audit".
#
# Each exception names its scenarios (an id, a list, or "*"), frontend, anatomy part and rule, optionally a theme,
# and must give the reason and the issue that removes it. A contrast exception also names its theme and lists the
# colour pairs it excuses. design/tools/storyboard/audit.py fails when a listed scenario or colour pair no longer
# matches any finding, so remove it in the pull request that fixes it. Never add one to make a new
# regression pass: fix the surface, or change docs/design/anatomy.md and the token scales first.

