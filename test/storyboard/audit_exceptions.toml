# colour pairs it excuses. design/tools/storyboard/audit.py fails when a listed scenario or colour pair no longer
# matches any finding, so remove it in the pull request that fixes it. Never add one to make a new
# regression pass: fix the surface, or change docs/design/anatomy.md and the token scales first.

