# ---- macOS ---------------------------------------------------------------------------------------------------

[[exception]]
scenario = ["edit.whichkey.leader", "minga.whichkey"]
frontend = "macos"
part = "whichKey.entry"
rule = "entry pitch"
reason = "WhichKeyOverlay rows are 22 pt; anatomy wants every clickable row at the 24 pt row pitch."
issue = 4044

[[exception]]
scenario = ["edit.whichkey.leader", "minga.whichkey"]
frontend = "macos"
part = "whichKey.entry"
rule = "key to label"
reason = "WhichKeyOverlay puts Spacing.sm between key and label in a fixed key slot; anatomy wants the key-to-label token."
issue = 4044

[[exception]]
scenario = ["edit.whichkey.leader", "minga.whichkey"]
frontend = "macos"
part = "whichKey.column"
rule = "column gap"
reason = "WhichKeyOverlay lays entries in fixed 220 pt columns, so the gap after the widest entry varies; anatomy wants the column-gap token."
issue = 4044

[[exception]]
scenario = ["edit.whichkey.leader", "minga.whichkey"]
frontend = "macos"
part = "whichKey.panel"
rule = "inset"
