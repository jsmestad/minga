name: Minga
options:
  minimumXcodeGenVersion: "2.45.4"
  bundleIdPrefix: com.minga
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    # NOTE: The Metal toolchain pin (TOOLCHAINS) is intentionally NOT global.
    # It lives only on the targets that compile Metal (Minga, MingaTests,
    # PreviewHost) so the Metal-free framework targets (MingaProtocol, MingaUI)
    # build — and render SwiftUI canvas previews — without the Metal toolchain.

packages:
  ViewInspector:
    url: https://github.com/nalexn/ViewInspector
    from: "0.10.3"

targets:
  MingaProtocol:
    type: framework
    platform: macOS
    sources:
      - path: Sources/Protocol/ProtocolTypes.swift
        type: file
      - path: Sources/Protocol/StatusBarUpdate.swift
        type: file
      - path: Sources/Protocol/GUIColorSlots.swift
        type: file
      - path: Sources/Protocol/FrameResourcePolicy.swift
        type: file
      - path: Sources/Renderer/WindowContent.swift
        type: file
      - path: Sources/Renderer/ResidentRowStore.swift
        type: file
      - path: Sources/Renderer/ResidentRenderPreparation.swift
        type: file
      - path: Sources/Protocol/AgentSurfaceTypes.swift
        type: file
      - path: Sources/Protocol/LatencyRecorder.swift
        type: file
      - path: Sources/Protocol/RenderPerformanceGate.swift
        type: file
      - path: Sources/Protocol/FrontendExtensionRuntimeMessage.swift
        type: file
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_NAME: MingaProtocol
        # No TOOLCHAINS pin: this framework is Metal-toolchain-free so it (and
        # MingaUI) can build SwiftUI canvas previews without the Metal toolchain.
    dependencies: []

  MingaUI:
    type: framework
    platform: macOS
    sources:
      - path: Sources/Views/Agent
      - path: Sources/Views/EditorChrome
      - path: Sources/Views/Extensions
      - path: Sources/Views/Modifiers
      - path: Sources/Views/Overlays
      - path: Sources/Views/Settings
      - path: Sources/Views/Sidebar
      - path: Sources/Views/Shared/EditTimelineState.swift
        type: file
      - path: Sources/Views/Shared/EditTimelineView.swift
        type: file
      - path: Sources/Views/Shared/EditorGeometry.swift
        type: file
      - path: Sources/Views/Shared/GUIFramePresentationMetrics.swift
        type: file
      - path: Sources/Views/Shared/GUIFrameCorrelation.swift
        type: file
      - path: Sources/Views/Shared/GUIState.swift
        type: file
      - path: Sources/Views/Shared/SparklineView.swift
        type: file
      - path: Sources/Views/Shared/TextHighlighting.swift
        type: file
      - path: Sources/Views/Shared/ThemeColors.swift
        type: file
      - path: Sources/ContentView.swift
        type: file
      - path: Sources/PreviewFixtures.swift
        type: file
      - path: Sources/Protocol/InputEncoder.swift
        type: file
      - path: Sources/Protocol/PortLogger.swift
        type: file
      - path: Sources/Extensions/FrontendExtensionRuntime.swift
        type: file
      - path: Sources/Views/Editor/InlineEditField.swift
        type: file
      - path: Sources/Views/Editor/BlinkingCursor.swift
        type: file
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_NAME: MingaUI
        # No TOOLCHAINS pin: this SwiftUI framework is Metal-toolchain-free so it
        # builds and renders SwiftUI canvas previews without the Metal toolchain.
    dependencies:
      - target: MingaProtocol

  MingaIPC:
    type: tool
    platform: macOS
    sources:
      - path: IPC/main.swift
        type: file
    settings:
      base:
        PRODUCT_NAME: minga-ipc
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: "YES"

  Minga:
    type: application
    platform: macOS
    sources:
      - path: Sources
        type: group
        excludes:
          - "PreviewHostApp.swift"
          - "PreviewRegistry.swift"
          - "Protocol/ProtocolTypes.swift"
          - "Protocol/StatusBarUpdate.swift"
          - "Protocol/GUIColorSlots.swift"
          - "Protocol/FrameResourcePolicy.swift"
          # MingaProtocol-owned (Slice 3)
          - "Renderer/WindowContent.swift"
          - "Renderer/ResidentRowStore.swift"
          - "Renderer/ResidentRenderPreparation.swift"
          - "Protocol/AgentSurfaceTypes.swift"
          - "Protocol/LatencyRecorder.swift"
          - "Protocol/RenderPerformanceGate.swift"
          - "Protocol/FrontendExtensionRuntimeMessage.swift"
          # MingaUI-owned (Slice 3)
          - "Protocol/InputEncoder.swift"
          - "Protocol/PortLogger.swift"
          - "Extensions/FrontendExtensionRuntime.swift"
          - "Views/Editor/InlineEditField.swift"
          - "Views/Editor/BlinkingCursor.swift"
          - "PreviewFixtures.swift"
          - "ContentView.swift"
          - "Views/Shared/EditorGeometry.swift"
          - "Views/Agent/**"
          - "Views/EditorChrome/**"
          - "Views/Extensions/**"
          - "Views/Modifiers/**"
          - "Views/Overlays/**"
          - "Views/Settings/**"
          - "Views/Sidebar/**"
          - "Views/Shared/EditTimelineState.swift"
          - "Views/Shared/EditTimelineView.swift"
          - "Views/Shared/GUIFramePresentationMetrics.swift"
          - "Views/Shared/GUIFrameCorrelation.swift"
          - "Views/Shared/GUIState.swift"
          - "Views/Shared/SparklineView.swift"
          - "Views/Shared/TextHighlighting.swift"
          - "Views/Shared/ThemeColors.swift"
      - path: .generated/protocol/ProtocolOpcodes.generated.swift
        name: ProtocolOpcodes.generated.swift
        type: file
      - path: .generated/protocol/ProtocolCommandSize.generated.swift
        name: ProtocolCommandSize.generated.swift
        type: file
      - path: .generated/protocol/ProtocolSemanticDecode.generated.swift
        name: ProtocolSemanticDecode.generated.swift
        type: file
      - path: Resources
        type: group
    settings:
      base:
        PRODUCT_NAME: Minga
        PRODUCT_BUNDLE_IDENTIFIER: com.minga.editor
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: Entitlements.plist
        ENABLE_HARDENED_RUNTIME: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: "YES"
        MTL_LANGUAGE_REVISION: UseDeploymentTarget
        # Workaround: macOS 26 beta cryptex bug prevents Metal toolchain auto-mount.
        # Remove once `metal --version` works without this (check Xcode Settings > Components).
        TOOLCHAINS: com.apple.dt.toolchain.Metal.32023.864
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
    dependencies:
      - target: MingaProtocol
      - target: MingaUI
      - target: MingaIPC
    preBuildScripts:
      - name: Generate protocol opcodes
        script: |
          cd "${SRCROOT}/.."
          if ! command -v mix >/dev/null 2>&1; then
            if [ -f macos/.generated/protocol/ProtocolOpcodes.generated.swift ]; then
              echo "warning: mix not found; reusing existing generated protocol artifacts (e.g. Xcode Preview build sandbox)"
              exit 0
            fi
            echo "error: mix is required to generate protocol artifacts. Install Elixir, then run: mix protocol.gen"
            exit 1
          fi
          mix protocol.gen
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/.generated/protocol/ProtocolOpcodes.generated.swift
          - $(SRCROOT)/.generated/protocol/ProtocolCommandSize.generated.swift
          - $(SRCROOT)/.generated/protocol/ProtocolSemanticDecode.generated.swift
    postCompileScripts:
      - name: Copy CLI launchers
        script: |
          mkdir -p "${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/bin"
          cp "${SRCROOT}/Resources/bin/minga" "${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/bin/minga"
          cp "${SRCROOT}/Resources/bin/minga-tui" "${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/bin/minga-tui"
          cp "${BUILT_PRODUCTS_DIR}/minga-ipc" "${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/bin/minga-ipc"
          chmod +x \
            "${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/bin/minga" \
            "${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/bin/minga-tui" \
            "${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/bin/minga-ipc"
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/Resources/bin/minga
          - $(SRCROOT)/Resources/bin/minga-tui
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/bin/minga
          - $(BUILT_PRODUCTS_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/bin/minga-tui
          - $(BUILT_PRODUCTS_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/bin/minga-ipc
    postBuildScripts:
      - name: Codesign
        script: |
          codesign --force --deep --sign - --options runtime --entitlements "${SRCROOT}/Entitlements.plist" "${BUILT_PRODUCTS_DIR}/${FULL_PRODUCT_NAME}"
        basedOnDependencyAnalysis: false

  MingaTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
        type: group
        excludes:
          # Snapshot test outputs are gitignored local artifacts; never bundle
          # them as test resources or the checked-in project fails on missing inputs.
          - "Snapshots/**"
          # Standalone optimized executable; unit tests cover its comparator separately.
          - "Performance/**"
      - path: Sources
        type: group
        excludes:
          - "MingaApp.swift"
          - "PreviewHostApp.swift"
          - "PreviewRegistry.swift"
          - "Protocol/ProtocolTypes.swift"
          - "Protocol/StatusBarUpdate.swift"
          - "Protocol/GUIColorSlots.swift"
          - "Protocol/FrameResourcePolicy.swift"
          # MingaProtocol-owned (Slice 3)
          - "Renderer/WindowContent.swift"
          - "Renderer/ResidentRowStore.swift"
          - "Renderer/ResidentRenderPreparation.swift"
          - "Protocol/AgentSurfaceTypes.swift"
          - "Protocol/LatencyRecorder.swift"
          - "Protocol/RenderPerformanceGate.swift"
          - "Protocol/FrontendExtensionRuntimeMessage.swift"
          # MingaUI-owned (Slice 3)
          - "Protocol/InputEncoder.swift"
          - "Protocol/PortLogger.swift"
          - "Extensions/FrontendExtensionRuntime.swift"
          - "Views/Editor/InlineEditField.swift"
          - "Views/Editor/BlinkingCursor.swift"
          - "PreviewFixtures.swift"
          - "ContentView.swift"
          - "Views/Shared/EditorGeometry.swift"
          - "Views/Agent/**"
          - "Views/EditorChrome/**"
          - "Views/Extensions/**"
          - "Views/Modifiers/**"
          - "Views/Overlays/**"
          - "Views/Settings/**"
          - "Views/Sidebar/**"
          - "Views/Shared/EditTimelineState.swift"
          - "Views/Shared/EditTimelineView.swift"
          - "Views/Shared/GUIFramePresentationMetrics.swift"
          - "Views/Shared/GUIFrameCorrelation.swift"
          - "Views/Shared/GUIState.swift"
          - "Views/Shared/SparklineView.swift"
          - "Views/Shared/TextHighlighting.swift"
          - "Views/Shared/ThemeColors.swift"
      - path: .generated/protocol/ProtocolOpcodes.generated.swift
        name: ProtocolOpcodes.generated.swift
        type: file
      - path: .generated/protocol/ProtocolCommandSize.generated.swift
        name: ProtocolCommandSize.generated.swift
        type: file
      - path: .generated/protocol/ProtocolSemanticDecode.generated.swift
        name: ProtocolSemanticDecode.generated.swift
        type: file
    settings:
      base:
        PRODUCT_NAME: MingaTests
        GENERATE_INFOPLIST_FILE: "YES"
        # Compiles Renderer/ Metal sources; needs the Metal toolchain pin.
        TOOLCHAINS: com.apple.dt.toolchain.Metal.32023.864
    dependencies:
      - target: MingaProtocol
      - target: MingaUI
      - package: ViewInspector
    preBuildScripts:
      - name: Generate protocol opcodes
        script: |
          cd "${SRCROOT}/.."
          if ! command -v mix >/dev/null 2>&1; then
            if [ -f macos/.generated/protocol/ProtocolOpcodes.generated.swift ]; then
              echo "warning: mix not found; reusing existing generated protocol artifacts (e.g. Xcode Preview build sandbox)"
              exit 0
            fi
            echo "error: mix is required to generate protocol artifacts. Install Elixir, then run: mix protocol.gen"
            exit 1
          fi
          mix protocol.gen
        basedOnDependencyAnalysis: false

  PreviewHost:
    type: application
    platform: macOS
    sources:
      - path: Sources
        type: group
        excludes:
          - "MingaApp.swift"
          - "Protocol/ProtocolTypes.swift"
          - "Protocol/StatusBarUpdate.swift"
          - "Protocol/GUIColorSlots.swift"
          - "Protocol/FrameResourcePolicy.swift"
          # MingaProtocol-owned (Slice 3)
          - "Renderer/WindowContent.swift"
          - "Renderer/ResidentRowStore.swift"
          - "Renderer/ResidentRenderPreparation.swift"
          - "Protocol/AgentSurfaceTypes.swift"
          - "Protocol/LatencyRecorder.swift"
          - "Protocol/RenderPerformanceGate.swift"
          - "Protocol/FrontendExtensionRuntimeMessage.swift"
          # MingaUI-owned (Slice 3)
          - "Protocol/InputEncoder.swift"
          - "Protocol/PortLogger.swift"
          - "Extensions/FrontendExtensionRuntime.swift"
          - "Views/Editor/InlineEditField.swift"
          - "Views/Editor/BlinkingCursor.swift"
          - "PreviewFixtures.swift"
          - "ContentView.swift"
          - "Views/Shared/EditorGeometry.swift"
          - "Views/Agent/**"
          - "Views/EditorChrome/**"
          - "Views/Extensions/**"
          - "Views/Modifiers/**"
          - "Views/Overlays/**"
          - "Views/Settings/**"
          - "Views/Sidebar/**"
          - "Views/Shared/EditTimelineState.swift"
          - "Views/Shared/EditTimelineView.swift"
          - "Views/Shared/GUIFramePresentationMetrics.swift"
          - "Views/Shared/GUIFrameCorrelation.swift"
          - "Views/Shared/GUIState.swift"
          - "Views/Shared/SparklineView.swift"
          - "Views/Shared/TextHighlighting.swift"
          - "Views/Shared/ThemeColors.swift"
      # The launchpad watermark (MingaLogo) and other catalog assets must be
      # bundled for previews; the app target gets them via `path: Resources`.
      - path: Resources/Assets.xcassets
      - path: .generated/protocol/ProtocolOpcodes.generated.swift
        name: ProtocolOpcodes.generated.swift
        type: file
      - path: .generated/protocol/ProtocolCommandSize.generated.swift
        name: ProtocolCommandSize.generated.swift
        type: file
      - path: .generated/protocol/ProtocolSemanticDecode.generated.swift
        name: ProtocolSemanticDecode.generated.swift
        type: file
    settings:
      base:
        PRODUCT_NAME: PreviewHost
        PRODUCT_BUNDLE_IDENTIFIER: com.minga.preview-host
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        # Builds the full shell incl. Renderer/ Metal sources; needs the toolchain pin.
        TOOLCHAINS: com.apple.dt.toolchain.Metal.32023.864
    dependencies:
      - target: MingaProtocol
      - target: MingaUI
    preBuildScripts:
      - name: Generate protocol opcodes
        script: |
          cd "${SRCROOT}/.."
          if ! command -v mix >/dev/null 2>&1; then
            if [ -f macos/.generated/protocol/ProtocolOpcodes.generated.swift ]; then
              echo "warning: mix not found; reusing existing generated protocol artifacts (e.g. Xcode Preview build sandbox)"
              exit 0
            fi
            echo "error: mix is required to generate protocol artifacts. Install Elixir, then run: mix protocol.gen"
            exit 1
          fi
          mix protocol.gen
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/.generated/protocol/ProtocolOpcodes.generated.swift
          - $(SRCROOT)/.generated/protocol/ProtocolCommandSize.generated.swift
          - $(SRCROOT)/.generated/protocol/ProtocolSemanticDecode.generated.swift

schemes:
  Minga:
    build:
      # parallelizeBuild off makes Xcode build in listed order: the app first,
      # so MingaTests' `@testable import Minga` resolves on a cold checkout
      # without a target dependency (which would infer TEST_HOST and embed the
      # xctest into the app, breaking the app's --deep codesign script).
      parallelizeBuild: false
      targets:
        Minga: all
        MingaTests: [test]
    test:
      targets:
        - MingaTests
  PreviewHost:
    build:
      targets:
        PreviewHost: all
